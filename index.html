<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Filtering Game — JF2026</title>
<script>
/* Charge jsQR depuis jsDelivr (fallback si BarcodeDetector absent) */
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
  s.onerror = function(){ console.warn('jsQR CDN indisponible — BarcodeDetector utilisé en priorité'); };
  document.head.appendChild(s);
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
:root {
  --navy: #1A1A2E; --navy2: #2E2E5E;
  --blue: #1F4E79; --blue2: #2E75B6; --blue-l: #DEEAF1;
  --coffee: #5C3317; --coffee2: #8B6914; --coffee-l: #FDF0D5;
  --mul: #4B2A82; --mul2: #8A4FC7; --mul-l: #EADDF7;
  --green: #375623; --green-l: #D5F0C3;
  --red: #C00000; --red-l: #FFD7D7;
  --gold: #C9A227; --white: #FFFFFF; --gray: #F2F2F2; --text: #222;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--navy); color: var(--white); min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
.header { background: var(--navy2); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header-logo { height: 36px; border-radius: 6px; object-fit: contain; }
.header-academie { height: 32px; object-fit: contain; }
.header-title { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
.header-team { font-size: 12px; background: var(--gold); color: var(--navy); padding: 4px 10px; border-radius: 20px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.header-team:hover { opacity: .85; }

/* FOOTER */
.site-footer { text-align: center; padding: 20px 16px 28px; font-size: 11px; color: #666; line-height: 1.6; border-top: 1px solid rgba(255,255,255,.07); margin-top: 8px; }
.site-footer img { height: 28px; display: block; margin: 8px auto 0; opacity: .75; }

/* RÈGLEMENT */
.reglement-content { background: var(--navy2); border-radius: 14px; padding: 20px; margin-bottom: 16px; line-height: 1.7; font-size: 14px; }
.reglement-content h2 { font-size: 16px; color: var(--gold); margin: 20px 0 8px; }
.reglement-content h3 { font-size: 14px; color: #ccc; margin: 14px 0 6px; }
.reglement-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.reglement-content th { background: rgba(255,255,255,.1); padding: 7px 10px; text-align: left; }
.reglement-content td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
.reglement-content blockquote { border-left: 3px solid var(--gold); padding: 8px 14px; margin: 10px 0; color: #bbb; font-size: 13px; background: rgba(201,162,39,.07); border-radius: 0 8px 8px 0; }
.reglement-content hr { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 16px 0; }
.reglement-content ul { padding-left: 20px; }
.reglement-content li { margin-bottom: 4px; }

/* CONTENT */
.content { flex: 1; padding: 20px 16px 32px; }

/* HOME */
.home-card { text-align: center; padding: 40px 24px; }
.home-icon { font-size: 64px; margin-bottom: 16px; }
.home-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--gold); }
.home-subtitle { font-size: 14px; color: #aaa; line-height: 1.5; }
.home-links { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
.btn-link { display: block; padding: 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; }
.btn-leaderboard { background: var(--gold); color: var(--navy); }
.btn-outline { background: rgba(255,255,255,.13); color: var(--white); border: 2px solid rgba(255,255,255,.45); font-weight: 700; }
.btn-outline:hover, .btn-outline:active { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.7); }

/* TEAM SELECT */
.screen-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.screen-sub { font-size: 13px; color: #aaa; margin-bottom: 24px; }
.teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team-btn { background: var(--navy2); border: 2px solid transparent; border-radius: 14px; padding: 14px 12px; text-align: center; cursor: pointer; transition: all .15s; font-size: 14px; font-weight: 700; color: var(--white); }
.team-btn.taken { border-color: var(--gold); background: #2a2a50; }
.team-btn:hover, .team-btn:active { border-color: var(--gold); background: #3a3a6a; transform: scale(.97); }

/* TEAM FORM */
.form-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
.text-input { width: 100%; background: var(--navy2); border: 2px solid #444; border-radius: 10px; padding: 12px 14px; color: var(--white); font-size: 15px; outline: none; }
.text-input:focus { border-color: var(--gold); }
.text-input::placeholder { color: #666; }
.form-group { margin-bottom: 16px; }
.members-list { display: flex; flex-direction: column; gap: 8px; }

/* PRODUCT CARD */
.workshop-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: .5px; margin-bottom: 16px; }
.badge-asp { background: var(--blue); color: var(--white); }
.badge-caf { background: var(--coffee); color: var(--white); }
.badge-mul { background: var(--mul); color: var(--white); }

.product-ref { font-size: 32px; font-weight: 900; margin-bottom: 2px; }
.product-ref.asp { color: var(--blue2); }
.product-ref.caf { color: var(--coffee2); }
.product-ref.mul { color: var(--mul2); }
.product-type { font-size: 14px; color: #aaa; margin-bottom: 24px; font-style: italic; }

.symptom-card { background: var(--navy2); border-radius: 14px; padding: 18px; margin-bottom: 20px; border-left: 4px solid var(--blue2); }
.symptom-card.caf { border-left-color: var(--coffee2); }
.symptom-card.mul { border-left-color: var(--mul2); }
.symptom-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.symptom-text { font-size: 16px; line-height: 1.6; color: var(--white); font-style: italic; }

/* VIDEO THUMBNAIL (vignette cliquable dans la symptom-card) */
.video-thumb { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; cursor: pointer; margin-bottom: 14px; aspect-ratio: 16/9; }
.video-thumb.square { aspect-ratio: 1/1; }
.video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.55)); transition: background .2s; pointer-events: none; }
.video-thumb:hover::after, .video-thumb:active::after { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)); }
.video-thumb .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform .15s; z-index: 2; }
.video-thumb:hover .play-btn, .video-thumb:active .play-btn { transform: translate(-50%,-50%) scale(1.08); }
.video-thumb .play-btn::before { content: ""; display: block; width: 0; height: 0; border-style: solid; border-width: 14px 0 14px 22px; border-color: transparent transparent transparent var(--navy); margin-left: 5px; }
.video-thumb .video-caption { position: absolute; bottom: 10px; left: 12px; right: 12px; color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.9); z-index: 2; text-align: center; }

/* VIDEO MODAL */
.video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
.video-modal.show { display: flex; }
.video-modal-inner { position: relative; width: 100%; max-width: 720px; }
.video-modal-iframe-wrap { position: relative; padding-top: 100%; background: #000; border-radius: 12px; overflow: hidden; }
.video-modal-iframe-wrap.r-16-9 { padding-top: 56.25%; }
.video-modal-iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.video-modal-close { position: absolute; top: -44px; right: 0; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 22px; font-weight: 700; cursor: pointer; line-height: 1; }
.video-modal-close:hover { background: rgba(255,255,255,0.3); }

/* SECTION TITLES */
.section-title { font-size: 12px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title .step-num { background: var(--gold); color: var(--navy); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }

/* ANSWER BUTTONS (selectable) */
.answer-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
.answer-btn { padding: 18px 16px; border-radius: 16px; border: 2px solid transparent; font-size: 16px; font-weight: 700; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; transition: all .15s; color: var(--white); background: var(--navy2); }
.answer-btn .icon { font-size: 26px; flex-shrink: 0; }
.answer-btn .label { flex: 1; }
.answer-btn .label-main { display: block; font-size: 16px; font-weight: 700; }
.answer-btn .label-sub { display: block; font-size: 12px; font-weight: 400; color: rgba(255,255,255,.7); margin-top: 2px; }
.answer-btn.btn-filtering.selected { background: #1e3a1e; border-color: #4caf50; box-shadow: 0 0 0 3px rgba(76,175,80,.25); }
.answer-btn.btn-reparation.selected { background: #3a1f0e; border-color: var(--coffee2); box-shadow: 0 0 0 3px rgba(139,105,20,.25); }
.answer-btn:hover, .answer-btn:active { transform: scale(.98); }
.answer-btn .check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #555; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; }
.answer-btn.selected .check { background: var(--gold); border-color: var(--gold); color: var(--navy); }
.answer-btn.selected .check::before { content: "✓"; }

/* SERIAL INPUT */
.serial-card { background: var(--navy2); border-radius: 14px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--gold); }
.serial-input { width: 100%; background: #1a1a2e; border: 2px solid #444; border-radius: 10px; padding: 14px; color: var(--white); font-size: 16px; outline: none; letter-spacing: 2px; font-family: 'Courier New', monospace; text-transform: uppercase; }
.serial-input:focus { border-color: var(--gold); }
.serial-input::placeholder { color: #555; letter-spacing: 0; font-family: 'Segoe UI', Arial, sans-serif; text-transform: none; }
.serial-hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }

/* VALIDATE BUTTON */
.btn-validate { background: var(--gold); color: var(--navy); border: none; border-radius: 14px; padding: 18px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
.btn-validate:disabled { background: #444; color: #777; cursor: not-allowed; }
.btn-validate:not(:disabled):hover { opacity: .9; }

/* MINUTEUR 5 MIN */
.timer-bar { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(41,182,246,.15); border: 2px solid rgba(41,182,246,.4); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; transition: background .4s, border-color .4s; }
.timer-icon { font-size: 20px; }
.timer-display { font-size: 30px; font-weight: 900; letter-spacing: 3px; font-variant-numeric: tabular-nums; color: #29B6F6; transition: color .3s; }
.timer-label { font-size: 11px; color: #80d4f7; text-transform: uppercase; letter-spacing: 1px; }
.timer-bar.warning { background: rgba(255,193,7,.15); border-color: rgba(255,193,7,.5); }
.timer-bar.warning .timer-display { color: #FFC107; }
.timer-bar.warning .timer-label { color: #ffe082; }
.timer-bar.danger { background: rgba(192,0,0,.18); border-color: rgba(192,0,0,.6); }
.timer-bar.danger .timer-display { color: #FF5252; animation: timer-pulse 1s infinite; }
.timer-bar.danger .timer-label { color: #ff8a80; }
.timer-bar.expired { background: rgba(192,0,0,.25); border-color: var(--red); }
.timer-bar.expired .timer-display { color: var(--red); }
@keyframes timer-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.already-answered { background: var(--navy2); border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #ccc; }
.already-answered .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: #4caf50; }
.dot-red { background: var(--red); }
.dot-yellow { background: var(--gold); }

/* RESULT */
.result-card { text-align: center; padding: 24px 20px; }
.result-icon { font-size: 64px; margin-bottom: 12px; }
.result-title { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
.result-title.correct { color: #4caf50; }
.result-title.wrong { color: var(--red); }
.result-title.mixed { color: var(--gold); }
.result-total { font-size: 42px; font-weight: 900; margin-bottom: 6px; }
.result-total-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
.score-pos { color: #4caf50; }
.score-neg { color: var(--red); }
.score-zero { color: #aaa; }

.score-breakdown { display: flex; gap: 10px; margin-bottom: 20px; }
.score-chip { flex: 1; background: var(--navy2); border-radius: 12px; padding: 14px 10px; text-align: center; }
.score-chip-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.score-chip-value { font-size: 22px; font-weight: 900; }
.score-chip-sub { font-size: 11px; color: #aaa; margin-top: 4px; }

.result-explanation { background: var(--navy2); border-radius: 14px; padding: 16px; margin-bottom: 14px; text-align: left; }
.expl-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 6px; }
.expl-text { font-size: 14px; line-height: 1.5; color: var(--white); }
.btn-next { background: var(--gold); color: var(--navy); border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 12px; }
.btn-next:hover { opacity: .9; }

/* LOADING */
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: var(--white); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

/* QR SCANNER */
.btn-camera { display: inline-flex; align-items: center; gap: 10px; margin: 18px auto 0; padding: 14px 28px; background: var(--gold); color: var(--navy); border: none; border-radius: 50px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 18px rgba(201,162,39,.4); transition: transform .15s, box-shadow .15s; }
.btn-camera:hover, .btn-camera:active { transform: scale(.96); box-shadow: 0 2px 8px rgba(201,162,39,.3); }
.btn-camera svg { width: 22px; height: 22px; flex-shrink: 0; }

.qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 500; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
.qr-modal.show { display: flex; }
.qr-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 22px; font-weight: 700; cursor: pointer; }
.qr-close:hover { background: rgba(255,255,255,.3); }
.qr-viewport { position: relative; width: min(88vw, 340px); aspect-ratio: 1/1; overflow: hidden; border-radius: 20px; }
.qr-viewport video { width: 100%; height: 100%; object-fit: cover; display: block; }
.qr-overlay { position: absolute; inset: 0; border: 3px solid rgba(201,162,39,.6); border-radius: 20px; pointer-events: none; }
.qr-corner { position: absolute; width: 30px; height: 30px; border-color: var(--gold); border-style: solid; }
.qr-corner.tl { top: 14px; left: 14px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
.qr-corner.tr { top: 14px; right: 14px; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
.qr-corner.bl { bottom: 14px; left: 14px; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
.qr-corner.br { bottom: 14px; right: 14px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }
.qr-scan-line { position: absolute; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); border-radius: 2px; animation: qrScan 2s ease-in-out infinite; }
@keyframes qrScan { 0%,100% { top: 15%; opacity: .8; } 50% { top: 80%; opacity: 1; } }
.qr-hint { color: #ccc; font-size: 14px; text-align: center; line-height: 1.5; padding: 0 20px; }
.qr-status { font-size: 13px; color: var(--gold); min-height: 20px; text-align: center; }

@media (prefers-color-scheme: light) {
  body { background: #f0f4f8; }
  #app { background: #f0f4f8; }
  .header { background: var(--navy); }
  .team-btn { color: var(--navy); background: var(--white); border-color: #ddd; }
  .team-btn.taken { border-color: var(--gold); background: #fffbe6; }
  .team-btn:hover { background: var(--blue-l); border-color: var(--blue2); }
  .text-input, .serial-input { background: var(--white); border-color: #ddd; color: var(--navy); }
  .symptom-card { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .symptom-text { color: var(--navy); }
  .already-answered { background: var(--white); color: var(--text); }
  .result-explanation { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .expl-text { color: var(--text); }
  .btn-outline { background: var(--white); color: var(--navy); border: 2px solid #bbb; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .btn-outline:hover, .btn-outline:active { background: var(--blue-l); border-color: var(--blue2); color: var(--blue); }
  .screen-sub { color: #666; }
  .product-type { color: #666; }
  .answer-btn { background: var(--white); color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .answer-btn .label-sub { color: #666; }
  .serial-card { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .score-chip { background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
}
</style>
</head>
<body>
<div id="app">
  <div class="loading"><div class="spinner"></div><p>Chargement...</p></div>
</div>
<div class="toast" id="toast"></div>

<!-- QR SCANNER MODAL -->
<div class="qr-modal" id="qr-modal">
  <button class="qr-close" onclick="closeQrScanner()" aria-label="Fermer le scanner">✕</button>
  <div class="qr-viewport">
    <video id="qr-video" autoplay playsinline muted></video>
    <canvas id="qr-canvas" style="display:none"></canvas>
    <div class="qr-overlay"></div>
    <div class="qr-corner tl"></div>
    <div class="qr-corner tr"></div>
    <div class="qr-corner bl"></div>
    <div class="qr-corner br"></div>
    <div class="qr-scan-line"></div>
  </div>
  <p class="qr-hint">Pointez la caméra vers le QR code<br>du produit en atelier</p>
  <div class="qr-status" id="qr-status">Démarrage de la caméra…</div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIGURATION FIREBASE
═══════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZVWNDjMG8XzN1X5L8UwrFZ8ThMk56zO0",
  authDomain: "jf2026-filtering.firebaseapp.com",
  databaseURL: "https://jf2026-filtering-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jf2026-filtering",
  storageBucket: "jf2026-filtering.firebasestorage.app",
  messagingSenderId: "505979371071",
  appId: "1:505979371071:web:428fe599f2966e5997c28a"
};

/* ═══════════════════════════════════════════
   DONNÉES — ÉQUIPES (40 slots communs aux 3 ateliers)
═══════════════════════════════════════════ */
const TEAMS = Array.from({length: 40}, (_, i) => ({
  id: `E${String(i+1).padStart(2,'0')}`,
  name: `Équipe ${i+1}`
}));

/* ═══════════════════════════════════════════
   DONNÉES — PRODUITS (45 scénarios : 15 ASP + 15 CAF + 15 MUL)
   Chaque produit :
     - workshop : "asp" | "caf" | "mul"
     - type     : libellé produit

function openVideoModal(vimeoId, ratio) {
  let modal = document.getElementById('video-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'video-modal';
    modal.className = 'video-modal';
    modal.innerHTML = `
      <div class="video-modal-inner">
        <button class="video-modal-close" onclick="closeVideoModal()" aria-label="Fermer la vidéo">×</button>
        <div class="video-modal-iframe-wrap" id="video-modal-wrap"></div>
      </div>`;
    modal.addEventListener('click', function(e){ if(e.target === modal) closeVideoModal(); });
    document.body.appendChild(modal);
  }
  const wrap = modal.querySelector('#video-modal-wrap');
  wrap.className = 'video-modal-iframe-wrap' + (ratio === '16/9' ? ' r-16-9' : '');
  wrap.innerHTML = `<iframe
    src="https://player.vimeo.com/video/${vimeoId}?autoplay=1&badge=0&autopause=0&player_id=0&playsinline=1"
    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
    allowfullscreen></iframe>`;
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', videoModalEscHandler);
}
function closeVideoModal() {
  const modal = document.getElementById('video-modal');
  if (!modal) return;
  modal.classList.remove('show');
  const wrap = modal.querySelector('#video-modal-wrap');
  if (wrap) wrap.innerHTML = ''; // stoppe la lecture immédiatement
  document.body.style.overflow = '';
  document.removeEventListener('keydown', videoModalEscHandler);
}
function videoModalEscHandler(e) { if (e.key === 'Escape') closeVideoModal(); }

let db, currentTeam = null, pendingProduct = null;
let selectedAnswer = null; // "Filtering" ou "Réparation" en attente de validation
let _timerInterval = null, _timerSeconds = 0;
let _audioCtx = null;

function _getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function _playBeep(freq = 880, duration = 0.08, volume = 0.35) {
  try {
    const ctx = _getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function startTimer(seconds) {
  stopTimer();
  _timerSeconds = seconds;
  _updateTimerUI();
  _timerInterval = setInterval(() => {
    _timerSeconds--;
    _updateTimerUI();
    if (_timerSeconds <= 0) { stopTimer(); _onTimerExpired(); }
    else if (_timerSeconds <= 30) {
      // Bip toutes les secondes ; double-bip à 10s et en dessous
      _playBeep(880, 0.08);
      if (_timerSeconds <= 10) setTimeout(() => _playBeep(880, 0.08), 150);
    }
  }, 1000);
}

function stopTimer() {
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
}

function _updateTimerUI() {
  const el = document.getElementById('countdown-display');
  const bar = document.getElementById('timer-bar');
  if (!el || !bar) return;
  const m = Math.floor(Math.max(_timerSeconds,0) / 60);
  const s = Math.max(_timerSeconds,0) % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  bar.classList.toggle('warning', _timerSeconds <= 60 && _timerSeconds > 30);
  bar.classList.toggle('danger',  _timerSeconds <= 30 && _timerSeconds > 0);
  bar.classList.toggle('expired', _timerSeconds <= 0);
}

function _onTimerExpired() {
  const el = document.getElementById('countdown-display');
  const bar = document.getElementById('timer-bar');
  if (el) el.textContent = '00:00';
  if (bar) bar.classList.add('expired');
  showToast('⏰ Temps écoulé ! Finalisez votre réponse.', 4000);
}

function init() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch(e) {
    db = null;
  }

  // Vérifier que la session locale correspond à la session Firebase en cours.
  // Si le coordinateur a fait un reset, gameSession aura changé → on efface le localStorage.
  const saved = localStorage.getItem('jf2026_team');
  if (saved) try { currentTeam = JSON.parse(saved); } catch(e) {}

  if (db && currentTeam) {
    db.ref('/gameSession').get().then(snap => {
      const firebaseSession = snap.val();
      const localSession = localStorage.getItem('jf2026_session');
      if (firebaseSession && localSession !== firebaseSession) {
        // Le jeu a été réinitialisé depuis ce téléphone — on purge la session locale
        localStorage.removeItem('jf2026_team');
        localStorage.setItem('jf2026_session', firebaseSession);
        currentTeam = null;
        const params = new URLSearchParams(window.location.search);
        const p = params.get('p');
        route(p);
      }
    }).catch(() => {});
  }

  // Synchroniser la session locale si elle n'est pas encore enregistrée
  if (db) {
    db.ref('/gameSession').get().then(snap => {
      const firebaseSession = snap.val();
      if (firebaseSession) localStorage.setItem('jf2026_session', firebaseSession);
    }).catch(() => {});
  }

  const params = new URLSearchParams(window.location.search);
  const p = params.get('p');
  route(p);
}

function route(productId) {
  if (productId && PRODUCTS[productId]) {
    if (!currentTeam) { pendingProduct = productId; showTeamSelect(); }
    else showProduct(productId);
  } else {
    showHome();
  }
}

async function confirmTeam() {
  const nameInput = document.getElementById('team-name-input');
  const name = nameInput?.value?.trim();

  const members = [];
  for (let i = 1; i <= 4; i++) {
    const val = document.getElementById(`m${i}`)?.value?.trim();
    if (val) members.push(val);
  }

  if (!name) {
    showToast('⚠️ Donnez un nom à votre équipe');
    return;
  }
  if (members.length === 0) {
    showToast('⚠️ Ajoutez au moins un membre');
    return;
  }

  // Attribuer un slot libre aléatoirement via transaction atomique Firebase
  // → le serveur choisit, aucun risque de doublon
  if (db) {
    // Mélange aléatoire de la liste des slots
    const shuffled = [...TEAMS].sort(() => Math.random() - 0.5);
    let assignedId = null;
    let assignedName = null;

    for (const slot of shuffled) {
      let taken = false;
      try {
        const result = await db.ref(`/teams/${slot.id}`).transaction(current => {
          if (current !== null && current.members && current.members.length > 0) {
            taken = true;
            return; // slot pris → abandon transaction
          }
          return { id: slot.id, name, members, updatedAt: Date.now(), locked: true };
        });
        if (!taken && result.committed) {
          assignedId = slot.id;
          assignedName = slot.name;
          break; // slot obtenu avec succès
        }
      } catch(e) {
        // erreur réseau sur ce slot → on essaie le suivant
      }
    }

    if (!assignedId) {
      showToast('⛔ Plus aucun slot disponible. Contactez un animateur.');
      return;
    }

    selectTeam(assignedId, name, members);
    return;
  }

  // Mode hors-ligne : slot local sans Firebase
  const fallbackId = `E${String(Math.floor(Math.random()*40)+1).padStart(2,'0')}`;
  selectTeam(fallbackId, name, members);
}

  showToast(`✅ Équipe : ${name}`);
  if (pendingProduct) { const p = pendingProduct; pendingProduct = null; showProduct(p); }
  else showHome();
}

function selectAnswer(answer) {
  selectedAnswer = answer;
  const fBtn = document.getElementById('btn-ans-F');
  const rBtn = document.getElementById('btn-ans-R');
  if (fBtn) fBtn.classList.toggle('selected', answer === F);
  if (rBtn) rBtn.classList.toggle('selected', answer === R);
  updateValidateBtn();
}

function updateValidateBtn() {
  const btn = document.getElementById('btn-validate');
  const serial = document.getElementById('serial-input')?.value?.trim();
  const keyword = document.getElementById('keyword-input')?.value?.trim();
  if (!btn) return;
  btn.disabled = !selectedAnswer || !serial || serial.length < 2 || !keyword || keyword.length < 2;
}

function normalizeSerial(s) {
  return String(s || '').trim().toUpperCase().replace(/\s+/g,'').replace(/[-_]/g,'');
}

async function submitFinal(productId) {
  if (!currentTeam) { showTeamSelect(); return; }
  const prod = PRODUCTS[productId];
  if (!prod) { showHome(); return; }

  // Guard : vérifier côté serveur que ce produit n'a pas déjà été soumis
  if (db) {
    try {
      const snap = await db.ref(`/submissions/${prod.workshop}/${currentTeam.id}/${productId}`).get();
      if (snap.exists()) {
        showToast('🔒 Ce produit a déjà été soumis par votre équipe.');
        setTimeout(() => showProduct(productId), 1000);
        return;
      }
    } catch(e) { /* en cas d'erreur réseau, on laisse continuer */ }
  }

  if (!selectedAnswer) { showToast('⚠️ Sélectionnez Filtering ou Réparation'); return; }
  const serialRaw = document.getElementById('serial-input')?.value?.trim() || '';
  if (!serialRaw) { showToast('⚠️ Saisissez le N° de série'); return; }
  const keywordRaw = document.getElementById('keyword-input')?.value?.trim() || '';
  if (!keywordRaw) { showToast('⚠️ Saisissez le mot-clé SAVVY'); return; }

  // Diagnostic score
  const diagCorrect = selectedAnswer === prod.correct;
  const diagScore = diagCorrect ? prod.points : -1;

  // Serial score
  const serialCorrect = normalizeSerial(serialRaw) === normalizeSerial(prod.serial);
  const serialScore = serialCorrect ? 1 : -1;

  // Keyword score (SAVVY)
  const keywordCorrect = normalizeSerial(keywordRaw) === normalizeSerial(prod.keyword);
  const keywordScore = keywordCorrect ? 1 : -1;

  const totalScore = diagScore + serialScore + keywordScore;

  // Save to Firebase
  if (db) {
    try {
      await db.ref(`/submissions/${prod.workshop}/${currentTeam.id}/${productId}`).set({
        team: currentTeam.id,
        teamName: currentTeam.name,
        members: currentTeam.members || [],
        product: productId,
        workshop: prod.workshop,
        answer: selectedAnswer,
        correct: prod.correct,
        diagScore,
        serialInput: serialRaw,
        serialExpected: prod.serial,
        serialCorrect,
        serialScore,
        keywordInput: keywordRaw,
        keywordExpected: prod.keyword,
        keywordCorrect,
        keywordScore,
        score: totalScore,
        timestamp: Date.now()
      });
    } catch(e) { showToast('Erreur de connexion. Vérifiez le Wi-Fi.'); }
  }

  showResult(prod, selectedAnswer, diagCorrect, diagScore, serialRaw, serialCorrect, serialScore, keywordRaw, keywordCorrect, keywordScore, totalScore);
}

function showResult(prod, answer, diagCorrect, diagScore, serialInput, serialCorrect, serialScore, keywordInput, keywordCorrect, keywordScore, total) {
  stopTimer();
  const okCount = (diagCorrect ? 1 : 0) + (serialCorrect ? 1 : 0) + (keywordCorrect ? 1 : 0);
  let icon, titleClass, title;
  if (okCount === 3) {
    icon = '🎯'; titleClass = 'correct'; title = 'Sans faute !';
  } else if (okCount === 0) {
    icon = '❌'; titleClass = 'wrong'; title = 'Triple erreur';
  } else {
    icon = '⚖️'; titleClass = 'mixed'; title = 'Réponse partielle';
  }

  const totalClass = total > 0 ? 'score-pos' : (total < 0 ? 'score-neg' : 'score-zero');
  const totalStr = total > 0 ? `+${total}` : `${total}`;

  const diagClass = diagScore > 0 ? 'score-pos' : 'score-neg';
  const serClass  = serialScore > 0 ? 'score-pos' : 'score-neg';
  const kwClass   = keywordScore > 0 ? 'score-pos' : 'score-neg';
  const diagStr = diagScore > 0 ? `+${diagScore}` : `${diagScore}`;
  const serStr  = serialScore > 0 ? `+${serialScore}` : `${serialScore}`;
  const kwStr   = keywordScore > 0 ? `+${keywordScore}` : `${keywordScore}`;

  const serialBlock = serialCorrect
    ? `<div class="result-explanation">
         <div class="expl-label">✅ N° de série</div>
         <div class="expl-text">Saisie correcte : <strong>${serialInput}</strong></div>
       </div>`
    : `<div class="result-explanation">
         <div class="expl-label">❌ N° de série</div>
         <div class="expl-text">Votre saisie : <strong>${serialInput}</strong><br>N° attendu : <strong>${prod.serial}</strong></div>
       </div>`;

  const keywordBlock = keywordCorrect
    ? `<div class="result-explanation">
         <div class="expl-label">✅ Mot-clé SAVVY</div>
         <div class="expl-text">Saisie correcte : <strong>${keywordInput}</strong></div>
       </div>`
    : `<div class="result-explanation">
         <div class="expl-label">❌ Mot-clé SAVVY</div>
         <div class="expl-text">Votre saisie : <strong>${keywordInput}</strong><br>Mot-clé attendu : <strong>${prod.keyword}</strong></div>
       </div>`;

  setApp(`${header()}
  <div class="content">
    <div class="result-card">
      <div class="result-icon">${icon}</div>
      <div class="result-title ${titleClass}">${title}</div>
      <div class="result-total ${totalClass}">${totalStr}</div>
      <div class="result-total-label">Total ce produit</div>

      <div class="score-breakdown">
        <div class="score-chip">
          <div class="score-chip-label">Diagnostic</div>
          <div class="score-chip-value ${diagClass}">${diagStr}</div>
          <div class="score-chip-sub">${diagCorrect ? '✔️ '+answer : '✘ '+answer}</div>
        </div>
        <div class="score-chip">
          <div class="score-chip-label">N° Série</div>
          <div class="score-chip-value ${serClass}">${serStr}</div>
          <div class="score-chip-sub">${serialCorrect ? '✔️ Correct' : '✘ Erroné'}</div>
        </div>
        <div class="score-chip">
          <div class="score-chip-label">SAVVY</div>
          <div class="score-chip-value ${kwClass}">${kwStr}</div>
          <div class="score-chip-sub">${keywordCorrect ? '✔️ Correct' : '✘ Erroné'}</div>
        </div>
      </div>

      <div class="result-explanation">
        <div class="expl-label">🔍 Explication diagnostic</div>
        <div class="expl-text">${prod.explanation}</div>
      </div>
      ${!diagCorrect ? `<div class="result-explanation">
        <div class="expl-label">✅ Bonne réponse attendue</div>
        <div class="expl-text"><strong>${prod.correct}</strong></div>
      </div>` : ''}
      ${serialBlock}
      ${keywordBlock}

      <button class="btn-next" onclick="showHome()">← Retour à l'accueil</button>
    </div>
  </div>`);
}

/* ═══════════════════════════════════════════
   QR SCANNER — BarcodeDetector (natif Chrome/Android) + jsQR (fallback)
═══════════════════════════════════════════ */
let _qrStream = null, _qrRaf = null, _qrActive = false, _qrDetector = null;
let _qrLastTick = 0;

/* Extrait l'ID produit depuis n'importe quel format de QR code */
function _extractProductId(raw) {
  if (!raw) return null;
  raw = raw.trim();

  // Format 1 : URL avec ?p=ASP-03
  try {
    const u = new URL(raw);
    const p = u.searchParams.get('p');
    if (p && PRODUCTS[p.toUpperCase()]) return p.toUpperCase();
  } catch(e) {}

  // Format 2 : texte multiligne "Code: ASP-03" ou "Code - ASP-03"
  const m = raw.match(/Code\s*[:\-]\s*([A-Z]{2,3}-\d{2})/i);
  if (m) { const p = m[1].toUpperCase(); if (PRODUCTS[p]) return p; }

  // Format 3 : pipe-séparé "Aspirateur | ASP-03 | Produit: …"
  const parts = raw.split('|').map(s => s.trim());
  for (const part of parts) {
    const p = part.toUpperCase();
    if (PRODUCTS[p]) return p;
  }

  // Format 4 : ID direct "ASP-03"
  const direct = raw.toUpperCase().replace(/\s/g,'');
  if (PRODUCTS[direct]) return direct;

  return null;
}

function _onProductFound(productId) {
  closeQrScanner();
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  showProduct(productId);
  history.replaceState(null, '', '?p=' + productId);
}

function openQrScanner() {
  const modal = document.getElementById('qr-modal');
  const status = document.getElementById('qr-status');
  if (!modal) return;
  _qrActive = true;
  modal.classList.add('show');
  status.textContent = 'Démarrage de la caméra…';

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = '📷 Caméra non disponible sur cet appareil';
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(stream => {
    if (!_qrActive) { stream.getTracks().forEach(t => t.stop()); return; }
    _qrStream = stream;
    const video = document.getElementById('qr-video');
    video.srcObject = stream;
    video.play().then(() => {
      /* Choisir la méthode de décodage disponible */
      if (typeof BarcodeDetector !== 'undefined') {
        /* ── Méthode 1 : BarcodeDetector (natif Chrome/Android, aucune dépendance) ── */
        BarcodeDetector.getSupportedFormats().then(formats => {
          if (formats.includes('qr_code')) {
            _qrDetector = new BarcodeDetector({ formats: ['qr_code'] });
            status.textContent = '📷 Caméra active — pointez vers un QR code';
            _qrRaf = requestAnimationFrame(_qrTickBD);
          } else {
            _startJsQRScan(status);
          }
        }).catch(() => _startJsQRScan(status));
      } else {
        _startJsQRScan(status);
      }
    });
  }).catch(err => {
    console.warn('QR cam:', err);
    status.textContent = '⛔ Accès caméra refusé ou indisponible';
  });
}

/* ── BarcodeDetector scan loop ── */
async function _qrTickBD(ts) {
  if (!_qrActive) return;
  if (ts - _qrLastTick < 300) { _qrRaf = requestAnimationFrame(_qrTickBD); return; }
  _qrLastTick = ts;
  const video = document.getElementById('qr-video');
  if (!video || video.readyState < 2) { _qrRaf = requestAnimationFrame(_qrTickBD); return; }
  try {
    const results = await _qrDetector.detect(video);
    for (const barcode of results) {
      const pid = _extractProductId(barcode.rawValue);
      if (pid) { _onProductFound(pid); return; }
    }
  } catch(e) {}
  _qrRaf = requestAnimationFrame(_qrTickBD);
}

/* ── jsQR scan loop ── */
function _startJsQRScan(status) {
  if (typeof jsQR === 'function') {
    status.textContent = '📷 Caméra active — pointez vers un QR code';
    _qrRaf = requestAnimationFrame(_qrTickJsQR);
  } else {
    /* jsQR pas encore chargé : attendre 2s et réessayer */
    status.textContent = '⏳ Chargement du décodeur QR…';
    setTimeout(() => {
      if (!_qrActive) return;
      if (typeof jsQR === 'function') {
        status.textContent = '📷 Caméra active — pointez vers un QR code';
        _qrRaf = requestAnimationFrame(_qrTickJsQR);
      } else {
        status.textContent = '⚠️ Décodeur QR indisponible hors-ligne — utilisez un autre navigateur ou activez le Wi-Fi';
      }
    }, 2000);
  }
}

function _qrTickJsQR(ts) {
  if (!_qrActive) return;
  if (ts - _qrLastTick < 250) { _qrRaf = requestAnimationFrame(_qrTickJsQR); return; }
  _qrLastTick = ts;
  const video = document.getElementById('qr-video');
  const canvas = document.getElementById('qr-canvas');
  if (!video || !canvas || video.readyState < 2 || video.videoWidth === 0) {
    _qrRaf = requestAnimationFrame(_qrTickJsQR); return;
  }
  const MAX = 640;
  const scale = Math.min(1, MAX / Math.max(video.videoWidth, video.videoHeight));
  canvas.width  = Math.round(video.videoWidth  * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const result = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
  if (result && result.data) {
    const pid = _extractProductId(result.data);
    if (pid) { _onProductFound(pid); return; }
    else {
      const st = document.getElementById('qr-status');
      if (st) st.textContent = '⚠️ QR lu mais inconnu — cherchez un QR produit JF2026';
    }
  }
  _qrRaf = requestAnimationFrame(_qrTickJsQR);
}

function closeQrScanner() {
  _qrActive = false;
  _qrDetector = null;
  if (_qrRaf) { cancelAnimationFrame(_qrRaf); _qrRaf = null; }
  if (_qrStream) { _qrStream.getTracks().forEach(t => t.stop()); _qrStream = null; }
  const video = document.getElementById('qr-video');
  if (video) video.srcObject = null;
  const modal = document.getElementById('qr-modal');
  if (modal) modal.classList.remove('show');
}

init();
</script>
