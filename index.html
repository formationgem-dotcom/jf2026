<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Filtering Game — JF2026</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
:root {
  --navy: #1A1A2E; --navy2: #2E2E5E;
  --blue: #1F4E79; --blue2: #2E75B6; --blue-l: #DEEAF1;
  --coffee: #5C3317; --coffee2: #8B6914; --coffee-l: #FDF0D5;
  --mul: #4B2A82; --mul2: #8A4FC7; --mul-l: #EADDF7;
  --green: #375623; --green-l: #D5F0C3;
  --red: #C00000; --red-l: #FFD7D7;
  --gold: #C9A227; --white: #FFFFFF; --gray: #F2F2F2; --text: #222;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--navy); color: var(--white); min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
.header { background: var(--navy2); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { height: 36px; border-radius: 6px; object-fit: contain; }
.header-title { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
.header-team { font-size: 12px; background: var(--gold); color: var(--navy); padding: 4px 10px; border-radius: 20px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.header-team:hover { opacity: .85; }

/* CONTENT */
.content { flex: 1; padding: 20px 16px 32px; }

/* HOME */
.home-card { text-align: center; padding: 40px 24px; }
.home-icon { font-size: 64px; margin-bottom: 16px; }
.home-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--gold); }
.home-subtitle { font-size: 14px; color: #aaa; line-height: 1.5; }
.home-links { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
.btn-link { display: block; padding: 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; }
.btn-leaderboard { background: var(--gold); color: var(--navy); }
.btn-outline { background: transparent; color: var(--white); border: 2px solid var(--navy2); }

/* TEAM SELECT */
.screen-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.screen-sub { font-size: 13px; color: #aaa; margin-bottom: 24px; }
.teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team-btn { background: var(--navy2); border: 2px solid transparent; border-radius: 14px; padding: 14px 12px; text-align: center; cursor: pointer; transition: all .15s; font-size: 14px; font-weight: 700; color: var(--white); }
.team-btn.taken { border-color: var(--gold); background: #2a2a50; }
.team-btn:hover, .team-btn:active { border-color: var(--gold); background: #3a3a6a; transform: scale(.97); }

/* TEAM FORM */
.form-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
.text-input { width: 100%; background: var(--navy2); border: 2px solid #444; border-radius: 10px; padding: 12px 14px; color: var(--white); font-size: 15px; outline: none; }
.text-input:focus { border-color: var(--gold); }
.text-input::placeholder { color: #666; }
.form-group { margin-bottom: 16px; }
.members-list { display: flex; flex-direction: column; gap: 8px; }

/* PRODUCT CARD */
.workshop-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: .5px; margin-bottom: 16px; }
.badge-asp { background: var(--blue); color: var(--white); }
.badge-caf { background: var(--coffee); color: var(--white); }
.badge-mul { background: var(--mul); color: var(--white); }

.product-ref { font-size: 32px; font-weight: 900; margin-bottom: 2px; }
.product-ref.asp { color: var(--blue2); }
.product-ref.caf { color: var(--coffee2); }
.product-ref.mul { color: var(--mul2); }
.product-type { font-size: 14px; color: #aaa; margin-bottom: 24px; font-style: italic; }

.symptom-card { background: var(--navy2); border-radius: 14px; padding: 18px; margin-bottom: 20px; border-left: 4px solid var(--blue2); }
.symptom-card.caf { border-left-color: var(--coffee2); }
.symptom-card.mul { border-left-color: var(--mul2); }
.symptom-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.symptom-text { font-size: 16px; line-height: 1.6; color: var(--white); font-style: italic; }

/* SECTION TITLES */
.section-title { font-size: 12px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title .step-num { background: var(--gold); color: var(--navy); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }

/* ANSWER BUTTONS (selectable) */
.answer-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
.answer-btn { padding: 18px 16px; border-radius: 16px; border: 2px solid transparent; font-size: 16px; font-weight: 700; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; transition: all .15s; color: var(--white); background: var(--navy2); }
.answer-btn .icon { font-size: 26px; flex-shrink: 0; }
.answer-btn .label { flex: 1; }
.answer-btn .label-main { display: block; font-size: 16px; font-weight: 700; }
.answer-btn .label-sub { display: block; font-size: 12px; font-weight: 400; color: rgba(255,255,255,.7); margin-top: 2px; }
.answer-btn.btn-filtering.selected { background: #1e3a1e; border-color: #4caf50; box-shadow: 0 0 0 3px rgba(76,175,80,.25); }
.answer-btn.btn-reparation.selected { background: #3a1f0e; border-color: var(--coffee2); box-shadow: 0 0 0 3px rgba(139,105,20,.25); }
.answer-btn:hover, .answer-btn:active { transform: scale(.98); }
.answer-btn .check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #555; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; }
.answer-btn.selected .check { background: var(--gold); border-color: var(--gold); color: var(--navy); }
.answer-btn.selected .check::before { content: "✓"; }

/* SERIAL INPUT */
.serial-card { background: var(--navy2); border-radius: 14px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--gold); }
.serial-input { width: 100%; background: #1a1a2e; border: 2px solid #444; border-radius: 10px; padding: 14px; color: var(--white); font-size: 16px; outline: none; letter-spacing: 2px; font-family: 'Courier New', monospace; text-transform: uppercase; }
.serial-input:focus { border-color: var(--gold); }
.serial-input::placeholder { color: #555; letter-spacing: 0; font-family: 'Segoe UI', Arial, sans-serif; text-transform: none; }
.serial-hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }

/* VALIDATE BUTTON */
.btn-validate { background: var(--gold); color: var(--navy); border: none; border-radius: 14px; padding: 18px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
.btn-validate:disabled { background: #444; color: #777; cursor: not-allowed; }
.btn-validate:not(:disabled):hover { opacity: .9; }

.already-answered { background: var(--navy2); border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #ccc; }
.already-answered .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: #4caf50; }
.dot-red { background: var(--red); }
.dot-yellow { background: var(--gold); }

/* RESULT */
.result-card { text-align: center; padding: 24px 20px; }
.result-icon { font-size: 64px; margin-bottom: 12px; }
.result-title { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
.result-title.correct { color: #4caf50; }
.result-title.wrong { color: var(--red); }
.result-title.mixed { color: var(--gold); }
.result-total { font-size: 42px; font-weight: 900; margin-bottom: 6px; }
.result-total-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
.score-pos { color: #4caf50; }
.score-neg { color: var(--red); }
.score-zero { color: #aaa; }

.score-breakdown { display: flex; gap: 10px; margin-bottom: 20px; }
.score-chip { flex: 1; background: var(--navy2); border-radius: 12px; padding: 14px 10px; text-align: center; }
.score-chip-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.score-chip-value { font-size: 22px; font-weight: 900; }
.score-chip-sub { font-size: 11px; color: #aaa; margin-top: 4px; }

.result-explanation { background: var(--navy2); border-radius: 14px; padding: 16px; margin-bottom: 14px; text-align: left; }
.expl-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 6px; }
.expl-text { font-size: 14px; line-height: 1.5; color: var(--white); }
.btn-next { background: var(--gold); color: var(--navy); border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 12px; }
.btn-next:hover { opacity: .9; }

/* LOADING */
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: var(--white); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

@media (prefers-color-scheme: light) {
  body { background: #f0f4f8; }
  #app { background: #f0f4f8; }
  .header { background: var(--navy); }
  .team-btn { color: var(--navy); background: var(--white); border-color: #ddd; }
  .team-btn.taken { border-color: var(--gold); background: #fffbe6; }
  .team-btn:hover { background: var(--blue-l); border-color: var(--blue2); }
  .text-input, .serial-input { background: var(--white); border-color: #ddd; color: var(--navy); }
  .symptom-card { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .symptom-text { color: var(--navy); }
  .already-answered { background: var(--white); color: var(--text); }
  .result-explanation { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .expl-text { color: var(--text); }
  .screen-sub { color: #666; }
  .product-type { color: #666; }
  .answer-btn { background: var(--white); color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .answer-btn .label-sub { color: #666; }
  .serial-card { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .score-chip { background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
}
</style>
</head>

/* ═══════════════════════════════════════════
   DONNÉES — ÉQUIPES (10 slots)
═══════════════════════════════════════════ */
const TEAMS = Array.from({length: 10}, (_, i) => ({
  id: `E${String(i+1).padStart(2,'0')}`,
  name: `Équipe ${i+1}`
}));

/* ═══════════════════════════════════════════
   DONNÉES — PRODUITS (45 scénarios : 15 ASP + 15 CAF + 15 MUL)
   Chaque produit :
     - workshop : "asp" | "caf" | "mul"
     - type     : libellé produit
     - symptom  : cas client
     - correct  : "Filtering" | "Réparation"
     - points   : 2 pour Filtering, 1 pour Réparation (si bonne réponse)
     - explanation : explication technique
     - serial   : N° de série attendu (à éditer avant l'événement)

   ⚠️ NUMÉROS DE SÉRIE — À PERSONNALISER AVANT L'ÉVÉNEMENT
   Remplacer chaque "SN-XXX-000" par le vrai N° de série du produit
   physiquement présent à l'atelier (étiquette au dos / sous l'appareil).
   La saisie est insensible à la casse et aux espaces.
═══════════════════════════════════════════ */
const F = "Filtering", R = "Réparation";
const PRODUCTS = {
  /* ──────── ATELIER ASPIRATION ──────── */
  "ASP-01":{workshop:"asp",type:"Aspirateur traîneau", serial:"SN-ASP-001",

  "ASP-03":{workshop:"asp",type:"Aspirateur traîneau", serial:"SN-ASP-003",
    symptom:"Une odeur de brûlé se dégage de l'appareil lorsqu'il fonctionne.",
    correct:R,points:1,explanation:"Odeur de brûlé = moteur défaillant. Envoi en atelier de réparation obligatoire."},
  "ASP-04":{workshop:"asp",type:"Aspirateur traîneau", serial:"SN-ASP-004",
    symptom:"Rien ne passe dans le tuyau. J'entends le moteur mais il n'y a aucune aspiration.",
    correct:F,points:2,explanation:"Corps étranger dans le tuyau — démontage et nettoyage du tuyau. Pas de panne."},
  "ASP-05":{workshop:"asp",type:"Balai aspirateur", serial:"SN-ASP-005",
    symptom:"Ma batterie tient moins de 5 minutes maintenant. Avant j'avais 30 minutes d'autonomie.",

  "ASP-06":{workshop:"asp",type:"Balai aspirateur", serial:"SN-ASP-006",

  "ASP-07":{workshop:"asp",type:"Balai aspirateur", serial:"SN-ASP-007",
    symptom:"La brosse motorisée ne tourne plus du tout. Mon balai aspire à peine.",

  "ASP-08":{workshop:"asp",type:"Balai aspirateur", serial:"SN-ASP-008",
    symptom:"Quand je l'allume, il vibre énormément et fait un bruit que je n'avais jamais entendu.",
    correct:R,points:1,explanation:"Vibrations fortes = roulement ou brosse défaillant. Envoi en atelier nécessaire."},
  "ASP-09":{workshop:"asp",type:"Balai laveur", serial:"SN-ASP-009",
    symptom:"Mon balai laveur laisse des traces blanches partout sur mon parquet après chaque passage.",
    correct:F,points:2,explanation:"Mauvais dosage de produit nettoyant — ajustement du dosage, rinçage du réservoir."},
  "ASP-10":{workshop:"asp",type:"Balai laveur", serial:"SN-ASP-010",
    symptom:"De l'eau s'écoule par le bas au niveau du réservoir pendant que je lave.",
    correct:R,points:1,explanation:"Joint du réservoir défaillant — envoi en atelier de réparation."},
  "ASP-11":{workshop:"asp",type:"Balai laveur", serial:"SN-ASP-011",
    symptom:"La brosse de lavage s'est arrêtée de tourner. Elle ne nettoie plus rien.",

  "ASP-14":{workshop:"asp",type:"Robot laveur", serial:"SN-ASP-014",

  "CAF-08":{workshop:"caf",type:"Cafetière à grain", serial:"SN-CAF-008",

/* ═══════════════════════════════════════════
   APP
═══════════════════════════════════════════ */
let db, currentTeam = null, pendingProduct = null;
let selectedAnswer = null; // "Filtering" ou "Réparation" en attente de validation

function init() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch(e) {
    db = null;
  }
  const saved = localStorage.getItem('jf2026_team');
  if (saved) try { currentTeam = JSON.parse(saved); } catch(e) {}
  const params = new URLSearchParams(window.location.search);
  const p = params.get('p');
  route(p);
}

function route(productId) {
  if (productId && PRODUCTS[productId]) {
    if (!currentTeam) { pendingProduct = productId; showTeamSelect(); }
    else showProduct(productId);
  } else {
    showHome();
  }
}

/* ---- RENDER HELPERS ---- */
function setApp(html) { document.getElementById('app').innerHTML = html; }

function header(showTeam = true) {
  const team = currentTeam ? `<span class="header-team" onclick="changeTeam()">${currentTeam.name}</span>` : '';
  return `<div class="header">
    <div class="header-left">
      <img src="Logo JF2026.jpg" alt="JF2026" class="header-logo" onerror="this.style.display='none'">
      <span class="header-title">⚡ Filtering Game</span>
    </div>
    ${showTeam ? team : ''}
  </div>`;
}

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

/* ---- SCREENS ---- */
function showHome() {
  selectedAnswer = null;
  const teamInfo = currentTeam
    ? `<div style="margin-top:16px">
        <p style="color:var(--gold);font-weight:700">${currentTeam.name}</p>
        ${currentTeam.members && currentTeam.members.length > 0
          ? `<p style="font-size:12px;color:#aaa;margin-top:4px">${currentTeam.members.join(' · ')}</p>`
          : ''}
       </div>`
    : '';
  setApp(`${header()}
  <div class="content">
    <div class="home-card">
      <div class="home-icon">⚡</div>
      <div class="home-title">Filtering Game</div>
      <div class="home-subtitle">Scannez le QR code d'un produit en atelier pour commencer votre diagnostic.</div>
      ${teamInfo}
      <div class="home-links">
        <a class="btn-link btn-leaderboard" href="leaderboard.html">🏆 Voir le classement</a>
        ${!currentTeam
          ? `<button class="btn-link btn-outline" onclick="showTeamSelect()">Sélectionner mon équipe</button>`
          : `<button class="btn-link btn-outline" onclick="changeTeam()">Changer d'équipe</button>`}
      </div>
    </div>
  </div>`);
}

async function showTeamSelect() {
  setApp(`${header(false)}
  <div class="content">
    <div class="loading"><div class="spinner"></div><p>Chargement des équipes...</p></div>
  </div>`);

  let registeredTeams = {};
  if (db) {
    try {
      const snap = await db.ref('/teams').get();
      if (snap.exists()) registeredTeams = snap.val();
    } catch(e) {}
  }

  const grid = TEAMS.map(t => {
    const reg = registeredTeams[t.id];
    const displayName = reg ? reg.name : t.name;
    const isTaken = !!reg;
    const memberCount = reg?.members?.length || 0;
    const statusText = isTaken
      ? `<div style="font-size:11px;color:var(--gold);margin-top:4px">${memberCount > 0 ? memberCount + ' membre' + (memberCount > 1 ? 's' : '') : 'Inscrite'}</div>`
      : `<div style="font-size:11px;color:#666;margin-top:4px">Disponible</div>`;
    const safeName = displayName.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<button class="team-btn${isTaken ? ' taken' : ''}" onclick="showTeamForm('${t.id}','${safeName}')">
      ${displayName}${statusText}
    </button>`;
  }).join('');

  setApp(`${header(false)}
  <div class="content">
    <div class="screen-title">👋 Qui êtes-vous ?</div>
    <div class="screen-sub">Choisissez un slot et créez votre équipe</div>
    <div class="teams-grid">${grid}</div>
  </div>`);
}

function showTeamForm(id, currentName) {
  const defaultName = currentName || TEAMS.find(t => t.id === id)?.name || id;
  setApp(`${header(false)}
  <div class="content">
    <div class="screen-title">✏️ Votre équipe</div>
    <div class="screen-sub">Slot : <strong>${id}</strong></div>

    <div class="form-group">
      <label class="form-label" for="team-name-input">Nom de l'équipe</label>
      <input class="text-input" id="team-name-input" type="text"
             placeholder="${defaultName}" value="${defaultName}"
             maxlength="30" />
    </div>

    <div class="form-group">
      <label class="form-label">Membres de l'équipe</label>
      <div class="members-list">
        <input class="text-input" id="m1" type="text" placeholder="Membre 1 (obligatoire)" maxlength="40" />
        <input class="text-input" id="m2" type="text" placeholder="Membre 2 (optionnel)" maxlength="40" />
        <input class="text-input" id="m3" type="text" placeholder="Membre 3 (optionnel)" maxlength="40" />
        <input class="text-input" id="m4" type="text" placeholder="Membre 4 (optionnel)" maxlength="40" />
      </div>
    </div>

    <button class="btn-validate" onclick="confirmTeam('${id}')">✅ Rejoindre</button>
    <button class="btn-link btn-outline" style="margin-top:10px" onclick="showTeamSelect()">← Retour</button>
  </div>`);

  // Pre-fill if team already exists locally
  const saved = localStorage.getItem('jf2026_team');
  if (saved) {
    try {
      const t = JSON.parse(saved);
      if (t.id === id && t.members) {
        t.members.forEach((m, i) => {
          const el = document.getElementById(`m${i+1}`);
          if (el) el.value = m;
        });
      }
    } catch(e) {}
  }
}

async function confirmTeam(id) {
  const nameInput = document.getElementById('team-name-input');
  const defaultName = TEAMS.find(t => t.id === id)?.name || id;
  const name = nameInput?.value?.trim() || defaultName;

  const members = [];
  for (let i = 1; i <= 4; i++) {
    const val = document.getElementById(`m${i}`)?.value?.trim();
    if (val) members.push(val);
  }

  if (members.length === 0) {
    showToast('⚠️ Ajoutez au moins un membre');
    return;
  }

  // Save team registration to Firebase
  if (db) {
    try {
      await db.ref(`/teams/${id}`).set({
        id, name, members, updatedAt: Date.now()
      });
    } catch(e) {
      showToast('Attention : erreur de connexion, continuez quand même.');
    }
  }

  selectTeam(id, name, members);
}

function selectTeam(id, name, members = []) {
  currentTeam = {id, name, members};
  localStorage.setItem('jf2026_team', JSON.stringify(currentTeam));
  showToast(`✅ Équipe : ${name}`);
  if (pendingProduct) { const p = pendingProduct; pendingProduct = null; showProduct(p); }
  else showHome();
}

function changeTeam() {
  currentTeam = null; pendingProduct = null;
  localStorage.removeItem('jf2026_team');
  showTeamSelect();
}

function workshopMeta(w) {
  if (w === 'asp') return {cls:'asp', badge:'badge-asp', name:'🌪️ Aspiration'};
  if (w === 'caf') return {cls:'caf', badge:'badge-caf', name:'☕ Broyeurs Café'};
  return {cls:'mul', badge:'badge-mul', name:'🎮 Multimédia'};
}

async function showProduct(productId) {
  selectedAnswer = null;
  const prod = PRODUCTS[productId];
  if (!prod) { showHome(); return; }
  const meta = workshopMeta(prod.workshop);

  // Check previous answer
  let prevHtml = '';
  if (db && currentTeam) {
    try {
      const snap = await db.ref(`/submissions/${prod.workshop}/${currentTeam.id}/${productId}`).get();
      if (snap.exists()) {
        const prev = snap.val();
        const total = (prev.score !== undefined) ? prev.score : ((prev.diagScore||0) + (prev.serialScore||0));
        const isCorrect = total > 0;
        const isWrong = total < 0;
        const dotClass = isCorrect ? 'dot-green' : (isWrong ? 'dot-red' : 'dot-yellow');
        const pts = total > 0 ? `+${total}` : `${total}`;
        prevHtml = `<div class="already-answered">
          <div class="dot ${dotClass}"></div>
          <span>Déjà soumis : <strong>${prev.answer}</strong> (${pts} pt${Math.abs(total)>1?'s':''})</span>
        </div>`;
      }
    } catch(e) {}
  }

  setApp(`${header()}
  <div class="content">
    <div>
      <span class="workshop-badge ${meta.badge}">${meta.name}</span>
    </div>
    <div class="product-ref ${meta.cls}">${productId}</div>
    <div class="product-type">${prod.type}</div>
    <div class="symptom-card ${meta.cls}">
      <div class="symptom-label">📢 Ce que dit le client</div>
      <div class="symptom-text">« ${prod.symptom} »</div>
    </div>
    ${prevHtml}

    <div class="section-title"><span class="step-num">1</span> Votre diagnostic</div>
    <div class="answer-buttons">
      <button class="answer-btn btn-filtering" id="btn-ans-F" onclick="selectAnswer('${F}')">
        <span class="icon">✅</span>
        <span class="label">
          <span class="label-main">Filtering</span>
          <span class="label-sub">Résoudre en magasin</span>
        </span>
        <span class="check"></span>
      </button>
      <button class="answer-btn btn-reparation" id="btn-ans-R" onclick="selectAnswer('${R}')">
        <span class="icon">🔧</span>
        <span class="label">
          <span class="label-main">Réparation</span>
          <span class="label-sub">Envoyer en atelier</span>
        </span>
        <span class="check"></span>
      </button>
    </div>

    <div class="section-title"><span class="step-num">2</span> N° de série du produit</div>
    <div class="serial-card">
      <input type="text" class="serial-input" id="serial-input"
             placeholder="Saisir le N° de série"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             oninput="updateValidateBtn()" />
      <div class="serial-hint">
        📍 Étiquette au dos ou sous l'appareil (ou sur la boîte).<br>
        Bonne saisie : <strong>+1 pt</strong> · Saisie erronée : <strong>−1 pt</strong>
      </div>
    </div>

    <button class="btn-validate" id="btn-validate" onclick="submitFinal('${productId}')" disabled>
      Valider ma réponse
    </button>
  </div>`);

  // Attention accessible : focus non agressif
  updateValidateBtn();
}

function selectAnswer(answer) {
  selectedAnswer = answer;
  const fBtn = document.getElementById('btn-ans-F');
  const rBtn = document.getElementById('btn-ans-R');
  if (fBtn) fBtn.classList.toggle('selected', answer === F);
  if (rBtn) rBtn.classList.toggle('selected', answer === R);
  updateValidateBtn();
}

function updateValidateBtn() {
  const btn = document.getElementById('btn-validate');
  const serial = document.getElementById('serial-input')?.value?.trim();
  if (!btn) return;
  btn.disabled = !selectedAnswer || !serial || serial.length < 2;
}

function normalizeSerial(s) {
  return String(s || '').trim().toUpperCase().replace(/\s+/g,'').replace(/[-_]/g,'');
}

async function submitFinal(productId) {
  if (!currentTeam) { showTeamSelect(); return; }
  const prod = PRODUCTS[productId];
  if (!prod) { showHome(); return; }
  if (!selectedAnswer) { showToast('⚠️ Sélectionnez Filtering ou Réparation'); return; }
  const serialRaw = document.getElementById('serial-input')?.value?.trim() || '';
  if (!serialRaw) { showToast('⚠️ Saisissez le N° de série'); return; }

  // Diagnostic score
  const diagCorrect = selectedAnswer === prod.correct;
  const diagScore = diagCorrect ? prod.points : -1;

  // Serial score
  const serialCorrect = normalizeSerial(serialRaw) === normalizeSerial(prod.serial);
  const serialScore = serialCorrect ? 1 : -1;

  const totalScore = diagScore + serialScore;

  // Save to Firebase
  if (db) {
    try {
      await db.ref(`/submissions/${prod.workshop}/${currentTeam.id}/${productId}`).set({
        team: currentTeam.id,
        teamName: currentTeam.name,
        members: currentTeam.members || [],
        product: productId,
        workshop: prod.workshop,
        answer: selectedAnswer,
        correct: prod.correct,
        diagScore,
        serialInput: serialRaw,
        serialExpected: prod.serial,
        serialCorrect,
        serialScore,
        score: totalScore,
        timestamp: Date.now()
      });
    } catch(e) { showToast('Erreur de connexion. Vérifiez le Wi-Fi.'); }
  }

  showResult(prod, selectedAnswer, diagCorrect, diagScore, serialRaw, serialCorrect, serialScore, totalScore);
}

function showResult(prod, answer, diagCorrect, diagScore, serialInput, serialCorrect, serialScore, total) {
  let icon, titleClass, title;
  if (diagCorrect && serialCorrect) {
    icon = '🎯'; titleClass = 'correct'; title = 'Sans faute !';
  } else if (!diagCorrect && !serialCorrect) {
    icon = '❌'; titleClass = 'wrong'; title = 'Double erreur';
  } else {
    icon = '⚖️'; titleClass = 'mixed'; title = 'Réponse partielle';
  }

  const totalClass = total > 0 ? 'score-pos' : (total < 0 ? 'score-neg' : 'score-zero');
  const totalStr = total > 0 ? `+${total}` : `${total}`;

  const diagClass = diagScore > 0 ? 'score-pos' : 'score-neg';
  const serClass  = serialScore > 0 ? 'score-pos' : 'score-neg';
  const diagStr = diagScore > 0 ? `+${diagScore}` : `${diagScore}`;
  const serStr  = serialScore > 0 ? `+${serialScore}` : `${serialScore}`;

  const serialBlock = serialCorrect
    ? `<div class="result-explanation">
         <div class="expl-label">✅ N° de série</div>
         <div class="expl-text">Saisie correcte : <strong>${serialInput}</strong></div>
       </div>`
    : `<div class="result-explanation">
         <div class="expl-label">❌ N° de série</div>
         <div class="expl-text">Votre saisie : <strong>${serialInput}</strong><br>N° attendu : <strong>${prod.serial}</strong></div>
       </div>`;

  setApp(`${header()}
  <div class="content">
    <div class="result-card">
      <div class="result-icon">${icon}</div>
      <div class="result-title ${titleClass}">${title}</div>
      <div class="result-total ${totalClass}">${totalStr}</div>
      <div class="result-total-label">Total ce produit</div>

      <div class="score-breakdown">
        <div class="score-chip">
          <div class="score-chip-label">Diagnostic</div>
          <div class="score-chip-value ${diagClass}">${diagStr}</div>
          <div class="score-chip-sub">${diagCorrect ? '✔️ '+answer : '✘ '+answer}</div>
        </div>
        <div class="score-chip">
          <div class="score-chip-label">N° Série</div>
          <div class="score-chip-value ${serClass}">${serStr}</div>
          <div class="score-chip-sub">${serialCorrect ? '✔️ Correct' : '✘ Erroné'}</div>
        </div>
      </div>

      <div class="result-explanation">
        <div class="expl-label">🔍 Explication diagnostic</div>
        <div class="expl-text">${prod.explanation}</div>
      </div>
      ${!diagCorrect ? `<div class="result-explanation">
        <div class="expl-label">✅ Bonne réponse attendue</div>
        <div class="expl-text"><strong>${prod.correct}</strong></div>
      </div>` : ''}
      ${serialBlock}

      <button class="btn-next" onclick="showHome()">← Retour à l'accueil</button>
    </div>
  </div>`);
}

init();
</script>

</html>
