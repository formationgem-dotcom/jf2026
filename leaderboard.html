<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — JF2026</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
:root {
  --navy: #1A1A2E; --navy2: #2E2E5E;
  --blue: #1F4E79; --blue2: #2E75B6; --blue-l: #DEEAF1;
  --coffee: #5C3317; --coffee2: #8B6914; --coffee-l: #FDF0D5;
  --green: #375623; --green-l: #D5F0C3;
  --gold: #C9A227; --white: #FFFFFF; --gray: #F2F2F2; --text: #222;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--navy); color: var(--white); min-height: 100vh; }

.header { background: var(--navy2); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,.4); position: sticky; top: 0; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo { height: 40px; border-radius: 6px; object-fit: contain; }
.header-title { font-size: 18px; font-weight: 800; color: var(--gold); }
.header-subtitle { font-size: 12px; color: #aaa; margin-top: 2px; }
.header-right { display: flex; gap: 10px; align-items: center; }
.btn-admin { background: var(--navy); color: #aaa; border: 1px solid #444; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }

/* LIVE INDICATOR */
.live-bar { background: linear-gradient(90deg, #1e3a1e, #2a502a); padding: 8px 24px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.live-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

/* PODIUM */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 12px; padding: 24px 16px 8px; }
.podium-item { text-align: center; flex: 1; max-width: 120px; }
.podium-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; padding: 0 4px; word-break: break-word; min-height: 32px; display: flex; align-items: center; justify-content: center; }
.podium-block { border-radius: 10px 10px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; }
.podium-block.p1 { background: linear-gradient(135deg, #b8870b, var(--gold)); height: 90px; }
.podium-block.p2 { background: linear-gradient(135deg, #6a6a6a, #aaa); height: 70px; }
.podium-block.p3 { background: linear-gradient(135deg, #7a4010, #cd7f32); height: 55px; }
.podium-medal { font-size: 24px; }
.podium-score { font-size: 18px; font-weight: 900; color: var(--navy); }

/* TABLE */
.table-wrap { padding: 0 16px 32px; }
.rank-table { width: 100%; border-collapse: collapse; }
.rank-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #aaa; padding: 10px 12px; text-align: left; border-bottom: 1px solid #333; }
.rank-table td { padding: 12px 12px; border-bottom: 1px solid #222; vertical-align: middle; }
.rank-table tr:last-child td { border-bottom: none; }
.rank-table tr:hover td { background: rgba(255,255,255,.03); }

.rank-num { font-size: 18px; font-weight: 900; color: #555; width: 36px; }
.rank-num.top { color: var(--gold); }
.team-name { font-size: 15px; font-weight: 700; }
.team-members { font-size: 11px; color: #888; margin-top: 2px; font-style: italic; }
.team-sub { font-size: 12px; color: #777; margin-top: 2px; }
.score-asp { color: var(--blue2); font-weight: 700; font-size: 14px; }
.score-caf { color: var(--coffee2); font-weight: 700; font-size: 14px; }
.score-total { font-size: 22px; font-weight: 900; color: var(--white); text-align: right; }
.score-total.leader { color: var(--gold); }
.progress-bar { background: #333; border-radius: 4px; height: 4px; margin-top: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
.fill-asp { background: var(--blue2); }
.fill-caf { background: var(--coffee2); }

/* ADMIN PANEL */
.admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
.admin-overlay.open { display: flex; }
.admin-card { background: var(--navy2); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; }
.admin-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.admin-sub { font-size: 13px; color: #aaa; margin-bottom: 20px; }
.pin-row { display: flex; gap: 10px; margin-bottom: 20px; }
.pin-input { flex: 1; background: #1a1a2e; border: 2px solid #444; border-radius: 10px; padding: 12px; color: var(--white); font-size: 16px; text-align: center; letter-spacing: 4px; }
.pin-btn { background: var(--gold); color: var(--navy); border: none; border-radius: 10px; padding: 12px 20px; font-weight: 800; font-size: 15px; cursor: pointer; }
.admin-section { margin-bottom: 20px; }
.admin-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #aaa; margin-bottom: 10px; }
.export-btn { background: #0e3a1a; color: #4caf50; border: 1px solid #4caf50; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 8px; }
.export-btn:hover { background: #1a5a28; }
.reset-btn { background: #3a0a0a; color: #ff6b6b; border: 1px solid #c00; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; }
.reset-btn:hover { background: #500; }
.close-btn { background: #333; color: var(--white); border: none; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }

/* STATS BAR */
.stats-bar { display: flex; gap: 0; background: var(--navy2); padding: 12px 24px; border-top: 1px solid #333; }
.stat { flex: 1; text-align: center; }
.stat-value { font-size: 20px; font-weight: 900; color: var(--gold); }
.stat-label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

/* LOADING */
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.no-data { text-align: center; padding: 40px 20px; color: #777; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="Logo JF2026.jpg" alt="JF2026" class="header-logo" onerror="this.style.display='none'">
    <div>
      <div class="header-title">🏆 Classement JF2026</div>
      <div class="header-subtitle">Temps réel — Filtering Game</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-admin" onclick="toggleAdmin()">⚙️ Admin</button>
    <a href="index.html" style="background:var(--navy2);color:#aaa;border:1px solid #444;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">← Jeu</a>
  </div>
</div>

<div class="live-bar">
  <div class="live-dot"></div>
  <span>Mise à jour en temps réel</span>
  <span style="margin-left:auto;color:#666;font-size:11px" id="last-update">—</span>
</div>

<div id="main-content"><div class="loading"><div class="spinner"></div><p>Connexion...</p></div></div>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="stat-reponses">—</div><div class="stat-label">Réponses</div></div>
  <div class="stat"><div class="stat-value" id="stat-equipes">—</div><div class="stat-label">Équipes actives</div></div>
  <div class="stat"><div class="stat-value" id="stat-max">—</div><div class="stat-label">Meilleur score</div></div>
</div>

<!-- ADMIN OVERLAY -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-card">
    <div class="admin-title">⚙️ Administration</div>
    <div class="admin-sub">Panneau coordinateur</div>
    <div id="admin-body">
      <div class="pin-row">
        <input type="password" class="pin-input" id="pin-input" maxlength="4" placeholder="PIN" oninput="checkPin()" />
        <button class="pin-btn" onclick="checkPin()">OK</button>
      </div>
      <div style="color:#777;font-size:13px;text-align:center">Code PIN : <strong>2026</strong></div>
    </div>
    <button class="close-btn" onclick="toggleAdmin()">✕ Fermer</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG FIREBASE
═══════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZVWNDjMG8XzN1X5L8UwrFZ8ThMk56zO0",
  authDomain: "jf2026-filtering.firebaseapp.com",
  databaseURL: "https://jf2026-filtering-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jf2026-filtering",
  storageBucket: "jf2026-filtering.firebasestorage.app",
  messagingSenderId: "505979371071",
  appId: "1:505979371071:web:428fe599f2966e5997c28a"
};

const ADMIN_PIN = "2026";
const MAX_SCORE = 27 * 2; // 54 pts max total

const TEAMS_LIST = Array.from({length:10},(_,i)=>({id:`E${String(i+1).padStart(2,'0')}`,name:`Équipe ${i+1}`}));
const ASP_PRODUCTS=["ASP-01","ASP-02","ASP-03","ASP-04","ASP-05","ASP-06","ASP-07","ASP-08","ASP-09","ASP-10","ASP-11","ASP-12","ASP-13","ASP-14","ASP-15"];
const CAF_PRODUCTS=["CAF-01","CAF-02","CAF-03","CAF-04","CAF-05","CAF-06","CAF-07","CAF-08","CAF-09","CAF-10","CAF-11","CAF-12","CAF-13","CAF-14","CAF-15"];

let db, adminUnlocked = false;
let currentSubmissions = {};
let currentTeamsData = {};

function init() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Listen to submissions in real time
    db.ref('/submissions').on('value', snap => {
      currentSubmissions = snap.val() || {};
      renderLeaderboard(currentSubmissions, currentTeamsData);
    });

    // Listen to team registrations in real time
    db.ref('/teams').on('value', snap => {
      currentTeamsData = snap.val() || {};
      renderLeaderboard(currentSubmissions, currentTeamsData);
    });

  } catch(e) {
    document.getElementById('main-content').innerHTML = `
      <div class="no-data">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <p style="font-size:16px;font-weight:700;margin-bottom:8px">Firebase non configuré</p>
        <p style="font-size:13px">Renseignez la config Firebase dans les deux fichiers HTML.</p>
      </div>`;
  }
}

function calculateScores(data, teamsData) {
  const scores = {};
  TEAMS_LIST.forEach(t => {
    const fbTeam = teamsData[t.id];
    const name = fbTeam?.name || t.name;
    const members = fbTeam?.members || [];
    scores[t.id] = {name, members, asp:0, caf:0, total:0, responses:0};
  });

  function processWorkshop(workshop, products) {
    const ws = data[workshop] || {};
    products.forEach(prodId => {
      Object.keys(ws).forEach(teamId => {
        const sub = ws[teamId][prodId];
        if (sub && scores[teamId] !== undefined) {
          scores[teamId][workshop] += sub.score || 0;
          scores[teamId].responses += 1;
        }
      });
    });
  }
  processWorkshop('asp', ASP_PRODUCTS);
  processWorkshop('caf', CAF_PRODUCTS);
  Object.keys(scores).forEach(id => { scores[id].total = scores[id].asp + scores[id].caf; });
  return scores;
}

function renderLeaderboard(data, teamsData) {
  const scores = calculateScores(data, teamsData);
  const teams = Object.values(scores).sort((a,b) => b.total - a.total || b.asp - a.asp);
  const totalResponses = teams.reduce((s,t)=>s+t.responses,0);
  const activeTeams = teams.filter(t=>t.responses>0).length;
  const maxScore = teams[0]?.total || 0;

  document.getElementById('stat-reponses').textContent = totalResponses;
  document.getElementById('stat-equipes').textContent = activeTeams;
  document.getElementById('stat-max').textContent = maxScore > 0 ? `+${maxScore}` : '0';
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString('fr-FR');

  // Podium (top 3)
  const medals = ['🥇','🥈','🥉'];
  const podiumClasses = ['p1','p2','p3'];
  const podiumOrder = [1,0,2];
  let podiumHtml = '';
  podiumOrder.forEach(idx => {
    const t = teams[idx];
    if (t) {
      podiumHtml += `<div class="podium-item">
        <div class="podium-name">${t.name}</div>
        <div class="podium-block ${podiumClasses[idx]}">
          <div class="podium-medal">${medals[idx]}</div>
          <div class="podium-score">${t.total}</div>
        </div>
      </div>`;
    }
  });

  // Table
  let tableHtml = `<table class="rank-table">
    <thead><tr>
      <th>#</th><th>Équipe</th>
      <th style="text-align:right">🌪️ Asp</th>
      <th style="text-align:right">☕ Café</th>
      <th style="text-align:right">Total</th>
    </tr></thead><tbody>`;

  teams.forEach((t, i) => {
    const rank = i + 1;
    const isTop = rank <= 3;
    const aspPct = Math.max(0, (t.asp / 27) * 100);
    const cafPct = Math.max(0, (t.caf / 27) * 100);
    const membersHtml = t.members && t.members.length > 0
      ? `<div class="team-members">${t.members.join(' · ')}</div>`
      : '';
    tableHtml += `<tr>
      <td><div class="rank-num ${isTop?'top':''}">${rank}</div></td>
      <td>
        <div class="team-name">${t.name}</div>
        ${membersHtml}
        <div class="team-sub">${t.responses} réponse${t.responses!==1?'s':''}</div>
        <div style="display:flex;gap:4px;margin-top:6px">
          <div style="flex:1"><div class="progress-bar"><div class="progress-fill fill-asp" style="width:${aspPct}%"></div></div></div>
          <div style="flex:1"><div class="progress-bar"><div class="progress-fill fill-caf" style="width:${cafPct}%"></div></div></div>
        </div>
      </td>
      <td style="text-align:right"><div class="score-asp">${t.asp > 0 ? '+' : ''}${t.asp}</div></td>
      <td style="text-align:right"><div class="score-caf">${t.caf > 0 ? '+' : ''}${t.caf}</div></td>
      <td style="text-align:right"><div class="score-total ${rank===1?'leader':''}">${t.total > 0 ? '+' : ''}${t.total}</div></td>
    </tr>`;
  });
  tableHtml += '</tbody></table>';

  document.getElementById('main-content').innerHTML = `
    <div style="padding:0 0 8px">${podiumOrder.some(i=>teams[i]?.responses>0)?`<div class="podium">${podiumHtml}</div>`:''}</div>
    <div class="table-wrap">${tableHtml}</div>`;
}

/* ---- ADMIN ---- */
function toggleAdmin() {
  const overlay = document.getElementById('admin-overlay');
  overlay.classList.toggle('open');
  if (!overlay.classList.contains('open')) {
    adminUnlocked = false;
    document.getElementById('admin-body').innerHTML = `
      <div class="pin-row">
        <input type="password" class="pin-input" id="pin-input" maxlength="4" placeholder="PIN" oninput="checkPin()" />
        <button class="pin-btn" onclick="checkPin()">OK</button>
      </div>
      <div style="color:#777;font-size:13px;text-align:center">Code PIN : <strong>2026</strong></div>`;
  }
}

function checkPin() {
  const pin = document.getElementById('pin-input')?.value;
  if (pin === ADMIN_PIN) showAdminPanel();
}

function showAdminPanel() {
  adminUnlocked = true;
  const scores = calculateScores(currentSubmissions, currentTeamsData);
  const teams = Object.values(scores).sort((a,b) => b.total - a.total);

  document.getElementById('admin-body').innerHTML = `
    <div class="admin-section">
      <div class="admin-section-title">📊 Export des résultats</div>
      <button class="export-btn" onclick="exportCSV()">📥 Télécharger les résultats (CSV)</button>
      <div style="font-size:11px;color:#666;margin-top:4px">Ouvrable dans Excel • Inclut toutes les réponses + noms des membres</div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">🏅 Classement actuel</div>
      ${teams.slice(0,5).map((t,i) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px">
          <span style="color:var(--gold);font-weight:900;width:20px">${i+1}.</span>
          <span style="flex:1">
            <strong>${t.name}</strong>
            ${t.members?.length > 0 ? `<br><span style="color:#888;font-size:11px">${t.members.join(', ')}</span>` : ''}
          </span>
          <span style="color:var(--gold);font-weight:700">${t.total > 0 ? '+' : ''}${t.total} pts</span>
        </div>`).join('')}
    </div>

    <div class="admin-section">
      <div class="admin-section-title">Danger zone</div>
      <button class="reset-btn" onclick="resetScores()">🗑️ Remettre tous les scores à zéro</button>
    </div>`;
}

async function exportCSV() {
  if (!db) { alert('Firebase non connecté.'); return; }

  try {
    const snap = await db.ref('/').get();
    const data = snap.val() || {};
    const submissions = data.submissions || {};
    const teamsData = data.teams || {};

    // Header row
    const rows = [[
      'Rang', 'Équipe ID', 'Nom équipe', 'Membres',
      'Atelier', 'Produit', 'Réponse donnée', 'Bonne réponse',
      'Correct ?', 'Points', 'Date/Heure'
    ]];

    // Compute rankings
    const scores = calculateScores(submissions, teamsData);
    const ranked = Object.entries(scores)
      .sort(([,a],[,b]) => b.total - a.total)
      .reduce((acc, [id], i) => { acc[id] = i + 1; return acc; }, {});

    ['asp', 'caf'].forEach(workshop => {
      const ws = submissions[workshop] || {};
      Object.keys(ws).forEach(teamId => {
        const teamData = teamsData[teamId] || {};
        const teamName = teamData.name || scores[teamId]?.name || teamId;
        const members = (teamData.members || []).join(', ');
        const rang = ranked[teamId] || '-';

        Object.values(ws[teamId]).forEach(sub => {
          const isCorrect = sub.score > 0 ? 'Oui' : 'Non';
          const dateStr = sub.timestamp
            ? new Date(sub.timestamp).toLocaleString('fr-FR')
            : '';
          rows.push([
            rang, teamId, teamName, members,
            workshop === 'asp' ? 'Aspiration' : 'Broyeurs Café',
            sub.product || '',
            sub.answer || '', sub.correct || '',
            isCorrect, sub.score || 0,
            dateStr
          ]);
        });
      });
    });

    // Sort by team rank, then product
    rows.sort((a, b) => {
      if (a === rows[0]) return -1; // keep header first
      return (a[0] - b[0]) || String(a[5]).localeCompare(String(b[5]));
    });

    // Generate CSV with BOM for Excel UTF-8
    const csv = rows.map(r =>
      r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')
    ).join('\n');

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const dateTag = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `resultats-jf2026-${dateTag}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Feedback
    const btn = document.querySelector('.export-btn');
    if (btn) { btn.textContent = '✅ Téléchargement lancé !'; setTimeout(() => { btn.textContent = '📥 Télécharger les résultats (CSV)'; }, 3000); }

  } catch(e) {
    alert('Erreur lors de l\'export : ' + e.message);
  }
}

async function resetScores() {
  if (!confirm('⚠️ Remettre TOUS les scores à zéro ? Cette action est irréversible.')) return;
  if (!db) return;
  try {
    await db.ref('/submissions').remove();
    await db.ref('/teams').remove();
    alert('Scores et équipes remis à zéro.');
    toggleAdmin();
  } catch(e) { alert('Erreur : ' + e.message); }
}

init();
</script>
</body>
</html>
