<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — JF2026</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --navy: #1A1A2E; --navy2: #2E2E5E;
  --blue: #1F4E79; --blue2: #2E75B6; --blue-l: #DEEAF1;
  --coffee: #5C3317; --coffee2: #8B6914; --coffee-l: #FDF0D5;
  --mul: #4B2A82; --mul2: #8A4FC7; --mul-l: #EADDF7;
  --green: #375623; --green-l: #D5F0C3;
  --gold: #C9A227; --white: #FFFFFF; --gray: #F2F2F2; --text: #222;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--navy); color: var(--white); min-height: 100vh; }

.header { background: var(--navy2); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,.4); position: sticky; top: 0; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo { height: 40px; border-radius: 6px; object-fit: contain; }
.header-title { font-size: 18px; font-weight: 800; color: var(--gold); }
.header-subtitle { font-size: 12px; color: #aaa; margin-top: 2px; }
.header-right { display: flex; gap: 10px; align-items: center; }
.btn-admin { background: var(--navy); color: #aaa; border: 1px solid #444; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }

/* LIVE INDICATOR */
.live-bar { background: linear-gradient(90deg, #1e3a1e, #2a502a); padding: 8px 24px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.live-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

/* PODIUM */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 12px; padding: 24px 16px 8px; }
.podium-item { text-align: center; flex: 1; max-width: 120px; }
.podium-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; padding: 0 4px; word-break: break-word; min-height: 32px; display: flex; align-items: center; justify-content: center; }
.podium-block { border-radius: 10px 10px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; }
.podium-block.p1 { background: linear-gradient(135deg, #b8870b, var(--gold)); height: 90px; }
.podium-block.p2 { background: linear-gradient(135deg, #6a6a6a, #aaa); height: 70px; }
.podium-block.p3 { background: linear-gradient(135deg, #7a4010, #cd7f32); height: 55px; }
.podium-medal { font-size: 24px; }
.podium-score { font-size: 18px; font-weight: 900; color: var(--navy); }

/* TABLE */
.table-wrap { padding: 0 16px 32px; overflow-x: auto; }
.rank-table { width: 100%; border-collapse: collapse; min-width: 720px; }
.rank-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #aaa; padding: 10px 8px; text-align: left; border-bottom: 1px solid #333; white-space: nowrap; }
.rank-table td { padding: 12px 8px; border-bottom: 1px solid #222; vertical-align: middle; }
.rank-table tr:last-child td { border-bottom: none; }
.rank-table tr:hover td { background: rgba(255,255,255,.03); }

.rank-num { font-size: 18px; font-weight: 900; color: #555; width: 36px; }
.rank-num.top { color: var(--gold); }
.team-name { font-size: 15px; font-weight: 700; }
.team-members { font-size: 11px; color: #888; margin-top: 2px; font-style: italic; }
.team-sub { font-size: 12px; color: #777; margin-top: 2px; }
.score-asp { color: var(--blue2); font-weight: 700; font-size: 14px; }
.score-caf { color: var(--coffee2); font-weight: 700; font-size: 14px; }
.score-mul { color: var(--mul2); font-weight: 700; font-size: 14px; }
.score-serial { color: var(--gold); font-weight: 700; font-size: 14px; }
.score-keyword { color: #4caf50; font-weight: 700; font-size: 14px; }
.score-total { font-size: 22px; font-weight: 900; color: var(--white); text-align: right; }
.score-total.leader { color: var(--gold); }
.progress-bar { background: #333; border-radius: 4px; height: 4px; margin-top: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
.fill-asp { background: var(--blue2); }
.fill-caf { background: var(--coffee2); }
.fill-mul { background: var(--mul2); }

/* ADMIN PANEL */
.admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
.admin-overlay.open { display: flex; }
.admin-card { background: var(--navy2); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; }
.admin-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.admin-sub { font-size: 13px; color: #aaa; margin-bottom: 20px; }
.pin-row { display: flex; gap: 10px; margin-bottom: 20px; }
.pin-input { flex: 1; background: #1a1a2e; border: 2px solid #444; border-radius: 10px; padding: 12px; color: var(--white); font-size: 16px; text-align: center; letter-spacing: 4px; }
.pin-btn { background: var(--gold); color: var(--navy); border: none; border-radius: 10px; padding: 12px 20px; font-weight: 800; font-size: 15px; cursor: pointer; }
.admin-section { margin-bottom: 20px; }
.admin-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #aaa; margin-bottom: 10px; }
.export-btn { background: #0e3a1a; color: #4caf50; border: 1px solid #4caf50; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 8px; }
.export-btn:hover { background: #1a5a28; }
.reset-btn { background: #3a0a0a; color: #ff6b6b; border: 1px solid #c00; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; }
.reset-btn:hover { background: #500; }
.close-btn { background: #333; color: var(--white); border: none; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }

/* STATS BAR */
.stats-bar { display: flex; gap: 0; background: var(--navy2); padding: 12px 24px; border-top: 1px solid #333; }
.stat { flex: 1; text-align: center; }
.stat-value { font-size: 20px; font-weight: 900; color: var(--gold); }
.stat-label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

/* LOADING */
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.no-data { text-align: center; padding: 40px 20px; color: #777; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="Logo JF2026.jpg" alt="JF2026" class="header-logo" onerror="this.style.display='none'">
    <div>
      <div class="header-title">🏆 Classement JF2026</div>
      <div class="header-subtitle">Temps réel — Filtering Game</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-admin" onclick="toggleAdmin()">⚙️ Admin</button>
    <a href="index.html" style="background:var(--navy2);color:#aaa;border:1px solid #444;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;">← Jeu</a>
  </div>
</div>

<div class="live-bar">
  <div class="live-dot"></div>
  <span>Mise à jour en temps réel</span>
  <span style="margin-left:auto;color:#666;font-size:11px" id="last-update">—</span>
</div>

<div id="main-content"><div class="loading"><div class="spinner"></div><p>Connexion...</p></div></div>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="stat-reponses">—</div><div class="stat-label">Réponses</div></div>
  <div class="stat"><div class="stat-value" id="stat-equipes">—</div><div class="stat-label">Équipes actives</div></div>
  <div class="stat"><div class="stat-value" id="stat-max">—</div><div class="stat-label">Meilleur score</div></div>
</div>

<!-- ADMIN OVERLAY -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-card">
    <div class="admin-title">⚙️ Administration</div>
    <div class="admin-sub">Panneau coordinateur</div>
    <div id="admin-body">
      <div class="pin-row">
        <input type="password" class="pin-input" id="pin-input" maxlength="4" placeholder="PIN" oninput="checkPin()" />
        <button class="pin-btn" onclick="checkPin()">OK</button>
      </div>
    </div>
    <button class="close-btn" onclick="toggleAdmin()">✕ Fermer</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG FIREBASE
═══════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZVWNDjMG8XzN1X5L8UwrFZ8ThMk56zO0",
  authDomain: "jf2026-filtering.firebaseapp.com",
  databaseURL: "https://jf2026-filtering-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jf2026-filtering",
  storageBucket: "jf2026-filtering.firebasestorage.app",
  messagingSenderId: "505979371071",
  appId: "1:505979371071:web:428fe599f2966e5997c28a"
};

const ADMIN_PIN = atob("MjAyNg==");
/* Max theoretical : diag 2*15 par atelier = 30 × 3 + série 1*45 + mot-clé SAVVY 1*45 = 180 pts */
const MAX_DIAG_PER_WORKSHOP = 30;
const MAX_SERIAL_TOTAL = 45;
const MAX_KEYWORD_TOTAL = 45;

const TEAMS_LIST = Array.from({length:40},(_,i)=>({id:`E${String(i+1).padStart(2,'0')}`,name:`Équipe ${i+1}`}));
const ASP_PRODUCTS = Array.from({length:15},(_,i)=>`ASP-${String(i+1).padStart(2,'0')}`);
const CAF_PRODUCTS = Array.from({length:15},(_,i)=>`CAF-${String(i+1).padStart(2,'0')}`);
const MUL_PRODUCTS = Array.from({length:15},(_,i)=>`MUL-${String(i+1).padStart(2,'0')}`);

let db, adminUnlocked = false;
let currentSubmissions = {};
let currentTeamsData = {};
let currentQuizSubmissions = {};

function init() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebase.auth().signInAnonymously().catch(() => {});

    // Listen to submissions in real time
    db.ref('/submissions').on('value', snap => {
      currentSubmissions = snap.val() || {};
      renderLeaderboard(currentSubmissions, currentTeamsData, currentQuizSubmissions);
    });

    // Listen to quiz submissions (Parcours Client)
    db.ref('/quiz_submissions/par').on('value', snap => {
      currentQuizSubmissions = snap.val() || {};
      renderLeaderboard(currentSubmissions, currentTeamsData, currentQuizSubmissions);
    });

    // Listen to team registrations in real time
    db.ref('/teams').on('value', snap => {
      currentTeamsData = snap.val() || {};
      renderLeaderboard(currentSubmissions, currentTeamsData, currentQuizSubmissions);
    });

  } catch(e) {
    document.getElementById('main-content').innerHTML = `
      <div class="no-data">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <p style="font-size:16px;font-weight:700;margin-bottom:8px">Firebase non configuré</p>
        <p style="font-size:13px">Renseignez la config Firebase dans les deux fichiers HTML.</p>
      </div>`;
  }
}

/**
 * Calcule les scores par équipe avec ventilation :
 *  - asp / caf / mul  : score DIAGNOSTIC uniquement (Filtering / Réparation)
 *  - serialBonus      : bonus global N° de série (somme des serialScore tous ateliers)
 *  - keywordBonus     : bonus global Mot-clé SAVVY (somme des keywordScore tous ateliers)
 *  - par              : score quiz Parcours Client (+1/-1 par question)
 *  - total            : somme des 6
 */
function calculateScores(data, teamsData, quizData) {
  const scores = {};
  TEAMS_LIST.forEach(t => {
    const fbTeam = teamsData[t.id];
    const name = fbTeam?.name || t.name;
    const members = fbTeam?.members || [];
    scores[t.id] = {name, members, asp:0, caf:0, mul:0, serialBonus:0, keywordBonus:0, par:0, total:0, responses:0};
  });

  function extractScores(sub) {
    // Rétro-compatibilité : si diagScore/serialScore/keywordScore absents, on reconstruit depuis "score".
    if (sub.diagScore !== undefined || sub.serialScore !== undefined || sub.keywordScore !== undefined) {
      return {
        diag: sub.diagScore || 0,
        serial: sub.serialScore || 0,
        keyword: sub.keywordScore || 0
      };
    }
    return { diag: sub.score || 0, serial: 0, keyword: 0 };
  }

  function processWorkshop(workshop, products) {
    const ws = data[workshop] || {};
    products.forEach(prodId => {
      Object.keys(ws).forEach(teamId => {
        const sub = ws[teamId][prodId];
        if (sub && scores[teamId] !== undefined) {
          const { diag, serial, keyword } = extractScores(sub);
          scores[teamId][workshop] += diag;
          scores[teamId].serialBonus += serial;
          scores[teamId].keywordBonus += keyword;
          scores[teamId].responses += 1;
        }
      });
    });
  }
  processWorkshop('asp', ASP_PRODUCTS);
  processWorkshop('caf', CAF_PRODUCTS);
  processWorkshop('mul', MUL_PRODUCTS);

  // Parcours Client quiz
  if (quizData) {
    Object.keys(quizData).forEach(teamId => {
      if (scores[teamId] !== undefined) {
        scores[teamId].par = quizData[teamId].score || 0;
        scores[teamId].responses += 1;
      }
    });
  }

  Object.keys(scores).forEach(id => {
    const s = scores[id];
    s.total = s.asp + s.caf + s.mul + s.serialBonus + s.keywordBonus + s.par;
  });
  return scores;
}

function renderLeaderboard(data, teamsData, quizData) {
  const scores = calculateScores(data, teamsData, quizData || {});
  const teams = Object.values(scores).sort((a,b) => b.total - a.total || (b.serialBonus + b.keywordBonus) - (a.serialBonus + a.keywordBonus));
  const totalResponses = teams.reduce((s,t)=>s+t.responses,0);
  const activeTeams = teams.filter(t=>t.responses>0).length;
  const maxScore = teams[0]?.total || 0;

  document.getElementById('stat-reponses').textContent = totalResponses;
  document.getElementById('stat-equipes').textContent = activeTeams;
  document.getElementById('stat-max').textContent = maxScore > 0 ? `+${maxScore}` : (maxScore < 0 ? maxScore : '0');
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString('fr-FR');

  // Podium (top 3)
  const medals = ['🥇','🥈','🥉'];
  const podiumClasses = ['p1','p2','p3'];
  const podiumOrder = [1,0,2];
  let podiumHtml = '';
  podiumOrder.forEach(idx => {
    const t = teams[idx];
    if (t) {
      podiumHtml += `<div class="podium-item">
        <div class="podium-name">${t.name}</div>
        <div class="podium-block ${podiumClasses[idx]}">
          <div class="podium-medal">${medals[idx]}</div>
          <div class="podium-score">${t.total}</div>
        </div>
      </div>`;
    }
  });

  // Table
  let tableHtml = `<table class="rank-table">
    <thead><tr>
      <th>#</th><th>Équipe</th>
      <th style="text-align:right">🌪️ Asp</th>
      <th style="text-align:right">☕ Café</th>
      <th style="text-align:right">🎮 Multi</th>
      <th style="text-align:right">🔖 N° Série</th>
      <th style="text-align:right">🔑 SAVVY</th>
      <th style="text-align:right">🎯 Parcours</th>
      <th style="text-align:right">Total</th>
    </tr></thead><tbody>`;

  teams.forEach((t, i) => {
    const rank = i + 1;
    const isTop = rank <= 3;
    const aspPct = Math.max(0, (t.asp / MAX_DIAG_PER_WORKSHOP) * 100);
    const cafPct = Math.max(0, (t.caf / MAX_DIAG_PER_WORKSHOP) * 100);
    const mulPct = Math.max(0, (t.mul / MAX_DIAG_PER_WORKSHOP) * 100);
    const membersHtml = t.members && t.members.length > 0
      ? `<div class="team-members">${t.members.join(' · ')}</div>`
      : '';
    const fmt = v => (v > 0 ? '+' : '') + v;
    const parColor = t.par > 0 ? '#1ABC9C' : (t.par < 0 ? 'var(--red)' : '#aaa');
    tableHtml += `<tr>
      <td><div class="rank-num ${isTop?'top':''}">${rank}</div></td>
      <td>
        <div class="team-name">${t.name}</div>
        ${membersHtml}
        <div class="team-sub">${t.responses} réponse${t.responses!==1?'s':''}</div>
        <div style="display:flex;gap:4px;margin-top:6px">
          <div style="flex:1"><div class="progress-bar"><div class="progress-fill fill-asp" style="width:${aspPct}%"></div></div></div>
          <div style="flex:1"><div class="progress-bar"><div class="progress-fill fill-caf" style="width:${cafPct}%"></div></div></div>
          <div style="flex:1"><div class="progress-bar"><div class="progress-fill fill-mul" style="width:${mulPct}%"></div></div></div>
        </div>
      </td>
      <td style="text-align:right"><div class="score-asp">${fmt(t.asp)}</div></td>
      <td style="text-align:right"><div class="score-caf">${fmt(t.caf)}</div></td>
      <td style="text-align:right"><div class="score-mul">${fmt(t.mul)}</div></td>
      <td style="text-align:right"><div class="score-serial">${fmt(t.serialBonus)}</div></td>
      <td style="text-align:right"><div class="score-keyword">${fmt(t.keywordBonus)}</div></td>
      <td style="text-align:right"><div style="font-weight:700;font-size:14px;color:${parColor}">${t.par !== 0 ? fmt(t.par) : '—'}</div></td>
      <td style="text-align:right"><div class="score-total ${rank===1?'leader':''}">${fmt(t.total)}</div></td>
    </tr>`;
  });
  tableHtml += '</tbody></table>';

  document.getElementById('main-content').innerHTML = `
    <div style="padding:0 0 8px">${podiumOrder.some(i=>teams[i]?.responses>0)?`<div class="podium">${podiumHtml}</div>`:''}</div>
    <div class="table-wrap">${tableHtml}</div>`;
}

/* ---- ADMIN ---- */
function toggleAdmin() {
  const overlay = document.getElementById('admin-overlay');
  overlay.classList.toggle('open');
  if (!overlay.classList.contains('open')) {
    adminUnlocked = false;
    document.getElementById('admin-body').innerHTML = `
      <div class="pin-row">
        <input type="password" class="pin-input" id="pin-input" maxlength="4" placeholder="PIN" oninput="checkPin()" />
        <button class="pin-btn" onclick="checkPin()">OK</button>
      </div>`;
  }
}

function checkPin() {
  const pin = document.getElementById('pin-input')?.value;
  if (pin === ADMIN_PIN) showAdminPanel();
}

function showAdminPanel() {
  adminUnlocked = true;
  const scores = calculateScores(currentSubmissions, currentTeamsData, currentQuizSubmissions);
  const teams = Object.values(scores).sort((a,b) => b.total - a.total);

  document.getElementById('admin-body').innerHTML = `
    <div class="admin-section">
      <div class="admin-section-title">📊 Export des résultats</div>
      <button class="export-btn" onclick="exportXLSX()">📥 Télécharger les résultats (Excel)</button>
      <div style="font-size:11px;color:#666;margin-top:4px">4 onglets : Résumé · Aspiration · Café · Multimédia — toutes les réponses détaillées</div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">🏅 Classement actuel</div>
      ${teams.slice(0,5).map((t,i) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px">
          <span style="color:var(--gold);font-weight:900;width:20px">${i+1}.</span>
          <span style="flex:1">
            <strong>${t.name}</strong>
            ${t.members?.length > 0 ? `<br><span style="color:#888;font-size:11px">${t.members.join(', ')}</span>` : ''}
          </span>
          <span style="color:var(--gold);font-weight:700">${t.total > 0 ? '+' : ''}${t.total} pts</span>
        </div>`).join('')}
    </div>

    <div class="admin-section">
      <div class="admin-section-title">🛠️ Gestion des équipes</div>
      <button class="export-btn" onclick="loadTeamEditor()" style="margin-bottom:6px">✏️ Modifier / Déverrouiller une équipe</button>
      <div style="font-size:11px;color:#666">Corrige une erreur de saisie ou libère un slot bloqué</div>
      <div id="team-editor-zone" style="margin-top:12px"></div>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">Danger zone</div>
      <button class="reset-btn" onclick="resetScores()">🗑️ Remettre tous les scores à zéro</button>
    </div>`;
}

/* ---- ADMIN : GESTION DES ÉQUIPES ---- */
async function loadTeamEditor() {
  if (!db) { alert('Firebase non connecté.'); return; }
  const zone = document.getElementById('team-editor-zone');
  if (!zone) return;
  zone.innerHTML = '<div style="color:#aaa;font-size:12px">Chargement…</div>';

  try {
    const snap = await db.ref('/teams').get();
    const teams = snap.val() || {};
    if (Object.keys(teams).length === 0) {
      zone.innerHTML = '<div style="color:#aaa;font-size:12px">Aucune équipe inscrite.</div>';
      return;
    }

    const rows = Object.values(teams).sort((a,b) => (a.id||'').localeCompare(b.id||'')).map(t => `
      <div style="background:#1a1a3a;border-radius:10px;padding:10px 12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:13px;font-weight:700;color:var(--gold)">${t.id}</span>
          <span style="font-size:11px;color:${t.locked ? '#4caf50' : '#f44336'}">${t.locked ? '🔒 Verrouillé' : '🔓 Libre'}</span>
        </div>
        <div style="font-size:12px;color:#ccc;margin-bottom:8px">
          <strong>${t.name || '—'}</strong><br>
          <span style="color:#888">${(t.members||[]).join(', ') || 'Aucun membre'}</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button onclick="editTeam('${t.id}')" style="background:#2a4a8a;border:none;color:#fff;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer">✏️ Modifier</button>
          <button onclick="unlockTeam('${t.id}')" style="background:#5a3a00;border:none;color:#ffb300;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer">🔓 Déverrouiller</button>
          <button onclick="deleteTeam('${t.id}')" style="background:#5a1a1a;border:none;color:#ff6b6b;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer">🗑️ Supprimer</button>
        </div>
      </div>`).join('');

    zone.innerHTML = rows;
  } catch(e) {
    zone.innerHTML = `<div style="color:#f44;font-size:12px">Erreur : ${e.message}</div>`;
  }
}

async function editTeam(teamId) {
  if (!db) return;
  const snap = await db.ref(`/teams/${teamId}`).get();
  const t = snap.val();
  if (!t) { alert('Équipe introuvable.'); return; }

  // Affiche un formulaire inline à la place de la liste
  const zone = document.getElementById('team-editor-zone');
  const membersStr = (t.members || []).join(', ');

  zone.innerHTML = `
    <div style="background:#1a1a3a;border-radius:10px;padding:14px;border:1px solid var(--gold)">
      <div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:12px">✏️ Modifier — ${teamId}</div>

      <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px">Nom de l'équipe</label>
      <input id="edit-team-name" type="text" value="${(t.name||'').replace(/"/g,'&quot;')}"
        style="width:100%;box-sizing:border-box;background:#0d0d2b;border:1px solid #444;border-radius:8px;color:#fff;padding:8px 10px;font-size:14px;margin-bottom:12px" />

      <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px">Participants (séparés par des virgules)</label>
      <input id="edit-team-members" type="text" value="${membersStr.replace(/"/g,'&quot;')}"
        style="width:100%;box-sizing:border-box;background:#0d0d2b;border:1px solid #444;border-radius:8px;color:#fff;padding:8px 10px;font-size:14px;margin-bottom:14px"
        placeholder="Prénom1, Prénom2, Prénom3" />

      <div style="display:flex;gap:8px">
        <button onclick="saveTeamEdit('${teamId}')"
          style="flex:1;background:var(--gold);border:none;color:#000;border-radius:8px;padding:9px;font-size:13px;font-weight:700;cursor:pointer">✅ Enregistrer</button>
        <button onclick="loadTeamEditor()"
          style="flex:1;background:#333;border:none;color:#fff;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer">✖ Annuler</button>
      </div>
    </div>`;
}

async function saveTeamEdit(teamId) {
  if (!db) return;
  const name = document.getElementById('edit-team-name')?.value?.trim();
  const membersRaw = document.getElementById('edit-team-members')?.value?.trim();
  if (!name) { alert('Le nom ne peut pas être vide.'); return; }
  const members = membersRaw ? membersRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  try {
    await db.ref(`/teams/${teamId}`).update({ name, members });
    alert(`✅ Équipe ${teamId} mise à jour.`);
    loadTeamEditor();
  } catch(e) {
    alert('Erreur lors de la sauvegarde : ' + e.message);
  }
}

async function unlockTeam(teamId) {
  if (!db) return;
  if (!confirm(`Déverrouiller le slot ${teamId} ? L'équipe pourra modifier son nom.`)) return;
  try {
    await db.ref(`/teams/${teamId}`).update({ locked: false });
    loadTeamEditor();
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
}

async function deleteTeam(teamId) {
  if (!db) return;
  if (!confirm(`Supprimer définitivement le slot ${teamId} ? Cette action est irréversible.`)) return;
  try {
    await db.ref(`/teams/${teamId}`).remove();
    loadTeamEditor();
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
}

/* ---- RESET COMPLET (scores + équipes + invalidation des sessions locales) ---- */
async function resetScores() {
  if (!db) { alert('Firebase non connecté.'); return; }
  const confirmed = confirm('⚠️ ATTENTION\n\nCette action va :\n• Effacer TOUS les scores\n• Supprimer TOUTES les équipes enregistrées\n• Forcer tous les téléphones à se réinscrire\n\nContinuer ?');
  if (!confirmed) return;
  const confirmed2 = confirm('Dernière confirmation : remettre le jeu à zéro ?');
  if (!confirmed2) return;

  try {
    await db.ref('/submissions').remove();
    await db.ref('/quiz_submissions').remove();
    await db.ref('/teams').remove();
    const newSession = Date.now().toString();
    await db.ref('/gameSession').set(newSession);
    alert('✅ Remise à zéro effectuée.\n\nTous les téléphones seront forcés à se réinscrire lors de leur prochaine action.');
    toggleAdmin();
  } catch(e) {
    alert('Erreur lors de la remise à zéro : ' + e.message);
  }
}

/* ---- EXPORT EXCEL MULTI-ONGLETS ---- */
function exportXLSX() {
  const scores = calculateScores(currentSubmissions, currentTeamsData, currentQuizSubmissions);
  const wb = XLSX.utils.book_new();

  /* ── Onglet 1 : Résumé classement ── */
  const summaryTeams = Object.values(scores).sort((a,b) => b.total - a.total);
  const summaryHeaders = ['Rang','Équipe','Membres','Asp – Diag','Café – Diag','Multi – Diag','Bonus N° Série','Bonus SAVVY','🎯 Parcours Client','TOTAL','Réponses'];
  const summaryRows = summaryTeams.map((t, i) => [
    i+1,
    t.name,
    (t.members||[]).join(', '),
    t.asp, t.caf, t.mul, t.serialBonus, t.keywordBonus, t.par, t.total, t.responses
  ]);
  const wsSummary = XLSX.utils.aoa_to_sheet([summaryHeaders, ...summaryRows]);
  wsSummary['!cols'] = [5,22,30,14,14,14,16,14,10,12].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Résumé');

  /* ── Helper : onglet détaillé par atelier ── */
  function buildDetailSheet(workshopKey, products) {
    const wsData = currentSubmissions[workshopKey] || {};
    const headers = [
      'Équipe','Membres','Produit',
      'Réponse donnée','Bonne réponse','Diag correct ?','Score Diag',
      'N° Série saisi','N° Série attendu','Série correcte ?','Score Série',
      'Mot-clé saisi','Mot-clé attendu','Mot-clé correct ?','Score SAVVY',
      'Score total produit','Horodatage'
    ];
    const rows = [];

    Object.keys(wsData).forEach(teamId => {
      const teamSubs = wsData[teamId] || {};
      products.forEach(prodId => {
        const sub = teamSubs[prodId];
        if (!sub) {
          // Produit non répondu par cette équipe
          const teamInfo = currentTeamsData[teamId] || {};
          rows.push([
            teamInfo.name || teamId,
            (teamInfo.members || []).join(', '),
            prodId,
            '—','—','Non répondu','',
            '','','','',
            '','','','',
            '','—'
          ]);
        } else {
          const diagLabel = v => v === 'filtering' ? 'Filtering Magasin' : v === 'sav' ? 'Envoi SAV' : (v || '?');
          const ts = sub.timestamp ? new Date(sub.timestamp).toLocaleString('fr-FR') : '—';
          rows.push([
            sub.teamName || teamId,
            (sub.members || []).join(', '),
            sub.product || prodId,
            diagLabel(sub.answer),
            diagLabel(sub.correct),
            sub.diagScore > 0 ? 'Oui' : 'Non',
            sub.diagScore != null ? sub.diagScore : '',
            sub.serialInput || '',
            sub.serialExpected || '',
            sub.serialCorrect ? 'Oui' : 'Non',
            sub.serialScore != null ? sub.serialScore : '',
            sub.keywordInput || '',
            sub.keywordExpected || '',
            sub.keywordCorrect ? 'Oui' : 'Non',
            sub.keywordScore != null ? sub.keywordScore : '',
            sub.score != null ? sub.score : ((sub.diagScore||0)+(sub.serialScore||0)+(sub.keywordScore||0)),
            ts
          ]);
        }
      });
    });

    // Tri : par équipe puis par produit
    rows.sort((a, b) => (a[0]||'').localeCompare(b[0]||'') || (a[2]||'').localeCompare(b[2]||''));

    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws['!cols'] = [20,28,10,20,20,14,12,18,18,14,12,18,18,14,12,14,18].map(w=>({wch:w}));
    return ws;
  }

  /* ── Onglets détaillés ── */
  XLSX.utils.book_append_sheet(wb, buildDetailSheet('asp', ASP_PRODUCTS), 'Aspiration');
  XLSX.utils.book_append_sheet(wb, buildDetailSheet('caf', CAF_PRODUCTS), 'Café');
  XLSX.utils.book_append_sheet(wb, buildDetailSheet('mul', MUL_PRODUCTS), 'Multimédia');

  /* ── Onglet Parcours Client ── */
  const QUIZ_QUESTIONS = ['PAR-Q1','PAR-Q2','PAR-Q3','PAR-Q4','PAR-Q5'];
  const QUIZ_LABELS = [
    'Q1 – Garantie légale de conformité',
    'Q2 – Filtering vs SAV (cafetière)',
    'Q3 – Hiérarchie des recours consommateur',
    'Q4 – Diagnostic écouteurs sans fil',
    'Q5 – Calcul de score Escape Gamme'
  ];
  const parHeaders = [
    'Équipe','Membres',
    ...QUIZ_QUESTIONS.map((q,i) => `${q} – Réponse (0=A…3=D)`),
    ...QUIZ_QUESTIONS.map((q,i) => `${q} – Correct ?`),
    ...QUIZ_QUESTIONS.map((q,i) => `${q} – Score`),
    'Bonnes réponses','Score Total Parcours','Horodatage'
  ];
  const parRows = [];
  Object.keys(currentQuizSubmissions).forEach(teamId => {
    const sub = currentQuizSubmissions[teamId];
    const teamInfo = currentTeamsData[teamId] || {};
    const answers = sub.answers || [];
    const answerMap = {};
    answers.forEach(a => { answerMap[a.qId] = a; });
    const reponses    = QUIZ_QUESTIONS.map(qId => answerMap[qId]?.selected ?? '—');
    const corrects    = QUIZ_QUESTIONS.map(qId => answerMap[qId] ? (answerMap[qId].isCorrect ? 'Oui' : 'Non') : '—');
    const subScores   = QUIZ_QUESTIONS.map(qId => answerMap[qId]?.score ?? '—');
    const ts = sub.completedAt ? new Date(sub.completedAt).toLocaleString('fr-FR') : '—';
    parRows.push([
      teamInfo.name || teamId,
      (teamInfo.members || []).join(', '),
      ...reponses,
      ...corrects,
      ...subScores,
      sub.correct ?? '—',
      sub.score ?? '—',
      ts
    ]);
  });
  parRows.sort((a,b) => (b[16]||0) - (a[16]||0)); // tri par score total desc
  const wsPar = XLSX.utils.aoa_to_sheet([parHeaders, ...parRows]);
  const parColWidths = [22, 30, ...Array(15).fill(18), 16, 16, 18];
  wsPar['!cols'] = parColWidths.map(w => ({wch: w}));
  XLSX.utils.book_append_sheet(wb, wsPar, 'Parcours Client');

  /* ── Téléchargement ── */
  XLSX.writeFile(wb, 'resultats_filtering_game_' + new Date().toISOString().slice(0,10) + '.xlsx');
}
