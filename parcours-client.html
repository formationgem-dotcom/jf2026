<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Parcours Client — Filtering Game JF2026</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
:root {
  --navy: #1A1A2E; --navy2: #2E2E5E;
  --par: #0E5F4A; --par2: #1ABC9C; --par-l: #D5F5E3;
  --green: #27AE60; --green-l: #D5F0C3;
  --red: #C00000; --red-l: #FFD7D7;
  --gold: #C9A227; --white: #FFFFFF; --gray: #F2F2F2; --text: #222;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--navy); color: var(--white); min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
.header { background: var(--navy2); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header-logo { height: 36px; border-radius: 6px; object-fit: contain; }
.header-academie { height: 32px; object-fit: contain; }
.header-title { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
.header-team { font-size: 12px; background: var(--gold); color: var(--navy); padding: 4px 10px; border-radius: 20px; font-weight: 700; cursor: pointer; white-space: nowrap; }

/* CONTENT */
.content { flex: 1; padding: 20px 16px 32px; }

/* LOADING */
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: var(--white); padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

/* TEAM SELECT */
.screen-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.screen-sub { font-size: 13px; color: #aaa; margin-bottom: 24px; }
.teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team-btn { background: var(--navy2); border: 2px solid transparent; border-radius: 14px; padding: 14px 12px; text-align: center; cursor: pointer; transition: all .15s; font-size: 14px; font-weight: 700; color: var(--white); }
.team-btn.taken { border-color: var(--gold); background: #2a2a50; }
.team-btn:hover, .team-btn:active { border-color: var(--gold); background: #3a3a6a; transform: scale(.97); }

/* TEAM FORM */
.form-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
.text-input { width: 100%; background: var(--navy2); border: 2px solid #444; border-radius: 10px; padding: 12px 14px; color: var(--white); font-size: 15px; outline: none; }
.text-input:focus { border-color: var(--gold); }
.text-input::placeholder { color: #666; }
.form-group { margin-bottom: 16px; }
.members-list { display: flex; flex-direction: column; gap: 8px; }

/* WORKSHOP BADGE */
.workshop-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: .5px; margin-bottom: 16px; background: var(--par); color: var(--white); }

/* PROGRESS BAR */
.progress-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.progress-label { font-size: 13px; font-weight: 700; color: var(--par2); }
.progress-counter { font-size: 13px; color: #aaa; }
.progress-track { width: 100%; height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; margin-bottom: 24px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--par2); border-radius: 3px; transition: width .4s ease; }

/* QUESTION CARD */
.question-card { background: var(--navy2); border-radius: 16px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--par2); }
.question-num { font-size: 11px; font-weight: 800; color: var(--par2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.question-text { font-size: 16px; line-height: 1.6; font-weight: 600; color: var(--white); }

/* OPTION BUTTONS */
.options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.option-btn {
  background: var(--navy2); border: 2px solid #444; border-radius: 14px;
  padding: 14px 16px; cursor: pointer; text-align: left; display: flex;
  align-items: center; gap: 12px; transition: all .15s; color: var(--white); width: 100%;
}
.option-letter { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
.option-text { flex: 1; font-size: 14px; line-height: 1.4; text-align: left; }
.option-btn:hover, .option-btn:active { border-color: var(--par2); background: rgba(26,188,156,.08); }
.option-btn.selected { border-color: var(--par2); background: rgba(26,188,156,.12); }
.option-btn.selected .option-letter { background: var(--par2); color: var(--navy); }
.option-btn.correct { border-color: var(--green); background: rgba(39,174,96,.12); }
.option-btn.correct .option-letter { background: var(--green); color: white; }
.option-btn.wrong { border-color: var(--red); background: rgba(192,0,0,.12); }
.option-btn.wrong .option-letter { background: var(--red); color: white; }
.option-btn:disabled { cursor: default; }
.option-btn:disabled:hover { transform: none; }

/* VALIDATE BUTTON */
.btn-validate { background: var(--par2); color: var(--navy); border: none; border-radius: 14px; padding: 18px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
.btn-validate:disabled { background: #444; color: #777; cursor: not-allowed; }
.btn-validate:not(:disabled):hover { opacity: .9; }

/* MINUTEUR 5 MIN */
.timer-bar { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(41,182,246,.15); border: 2px solid rgba(41,182,246,.4); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; transition: background .4s, border-color .4s; }
.timer-display { font-size: 30px; font-weight: 900; letter-spacing: 3px; font-variant-numeric: tabular-nums; color: #29B6F6; transition: color .3s; }
.timer-label { font-size: 11px; color: #80d4f7; text-transform: uppercase; letter-spacing: 1px; }
.timer-bar.warning { background: rgba(255,193,7,.15); border-color: rgba(255,193,7,.5); }
.timer-bar.warning .timer-display { color: #FFC107; }
.timer-bar.warning .timer-label { color: #ffe082; }
.timer-bar.danger { background: rgba(192,0,0,.18); border-color: rgba(192,0,0,.6); }
.timer-bar.danger .timer-display { color: #FF5252; animation: timer-pulse 1s infinite; }
.timer-bar.danger .timer-label { color: #ff8a80; }
.timer-bar.expired { background: rgba(192,0,0,.25); border-color: #C00000; }
.timer-bar.expired .timer-display { color: #C00000; }
@keyframes timer-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* FEEDBACK CARD */
.feedback-card { border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.feedback-card.correct { background: rgba(39,174,96,.1); border: 2px solid var(--green); }
.feedback-card.wrong { background: rgba(192,0,0,.1); border: 2px solid var(--red); }
.feedback-icon { font-size: 28px; margin-bottom: 8px; }
.feedback-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.feedback-title.correct { color: var(--green); }
.feedback-title.wrong { color: var(--red); }
.feedback-expl { font-size: 13px; line-height: 1.5; color: #ccc; }
.btn-next { background: var(--gold); color: var(--navy); border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 12px; }
.btn-next:hover { opacity: .9; }

/* RESULT SCREEN */
.result-card { text-align: center; padding: 24px 20px; }
.result-icon { font-size: 64px; margin-bottom: 12px; }
.result-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; color: var(--par2); }
.result-score-big { font-size: 52px; font-weight: 900; margin-bottom: 4px; }
.result-score-big.pos { color: var(--green); }
.result-score-big.zero { color: #aaa; }
.result-score-big.neg { color: var(--red); }
.result-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }

.answer-summary { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; text-align: left; }
.answer-row { display: flex; align-items: center; gap: 10px; background: var(--navy2); border-radius: 10px; padding: 10px 14px; }
.answer-row .q-label { font-size: 12px; font-weight: 800; color: #aaa; flex-shrink: 0; width: 40px; }
.answer-row .q-text { flex: 1; font-size: 12px; color: #ccc; line-height: 1.3; }
.answer-row .q-score { font-size: 14px; font-weight: 900; flex-shrink: 0; }
.q-score.pos { color: var(--green); }
.q-score.neg { color: var(--red); }

.btn-home { background: var(--gold); color: var(--navy); border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; margin-bottom: 10px; }
.btn-lb { background: rgba(255,255,255,.1); color: var(--white); border: none; border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; text-decoration: none; display: block; text-align: center; }
.btn-lb:hover { background: rgba(255,255,255,.18); }

/* ALREADY DONE */
.done-card { background: rgba(26,188,156,.07); border: 2px solid var(--par2); border-radius: 16px; padding: 24px 20px; text-align: center; }

/* FOOTER */
.site-footer { text-align: center; padding: 20px 16px 28px; font-size: 11px; color: #666; line-height: 1.6; border-top: 1px solid rgba(255,255,255,.07); margin-top: 8px; }

/* BTN OUTLINE */
.btn-outline { display: block; padding: 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.13); color: var(--white); margin-top: 10px; }
.btn-outline:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="app">
  <div class="loading"><div class="spinner"></div><p>Chargement...</p></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   FIREBASE CONFIG
═══════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZVWNDjMG8XzN1X5L8UwrFZ8ThMk56zO0",
  authDomain: "jf2026-filtering.firebaseapp.com",
  databaseURL: "https://jf2026-filtering-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jf2026-filtering",
  storageBucket: "jf2026-filtering.firebasestorage.app",
  messagingSenderId: "505979371071",
  appId: "1:505979371071:web:428fe599f2966e5997c28a"
};

/* ═══════════════════════════════════════════
   ÉQUIPES (40 slots, identiques aux autres ateliers)
═══════════════════════════════════════════ */
const TEAMS = Array.from({length: 40}, (_, i) => ({
  id: `E${String(i+1).padStart(2,'0')}`,
  name: `Équipe ${i+1}`
}));

/* ═══════════════════════════════════════════
   QUIZ — 5 QUESTIONS QCU
   correct : index de la bonne réponse (0=A, 1=B, 2=C, 3=D)
   scoring : +1 bonne réponse, -1 mauvaise réponse
═══════════════════════════════════════════ */
const QUIZ = [
  {
    id: "PAR-Q1",
    question: "Un client rapporte son téléviseur acheté il y a 20 mois avec un défaut apparu spontanément. Quelle est la durée légale de garantie de conformité applicable en France depuis 2022 ?",
    options: [
      "12 mois",
      "18 mois",
      "24 mois",
      "36 mois"
    ],
    correct: 2,
    explanation: "La garantie légale de conformité est de 24 mois en France depuis le 1er janvier 2022 (directive EU 2019/771). Durant les 12 premiers mois, le défaut est présumé antérieur à la livraison sans preuve contraire."
  },
  {
    id: "PAR-Q2",
    question: "Un client apporte sa cafetière à grain qui « ne fait plus de café ». Vous constatez qu'elle n'a jamais été détartrée depuis son achat il y a 3 ans. Quelle est la première action à mener ?",
    options: [
      "Enregistrer un bon de dépôt SAV",
      "Proposer un échange sous garantie commerciale",
      "Lancer un cycle de détartrage en magasin devant le client",
      "Contacter le fabricant pour un devis de réparation"
    ],
    correct: 2,
    explanation: "Le calcaire est la première cause de pannes des cafetières. Un détartrage en magasin résout la majorité des cas sans envoi SAV : c'est du filtering magasin (+2 pts dans l'Escape Gamme !)."
  },
  {
    id: "PAR-Q3",
    question: "Un client réclame un remboursement pour un produit en panne sous garantie légale de conformité. Quel est l'ordre légal des recours ?",
    options: [
      "Remboursement immédiat, toujours possible",
      "Réparation ou remplacement en 1er lieu ; remboursement seulement si impossible ou trop long",
      "Avoir commercial uniquement, au choix du vendeur",
      "Échange immédiat sans condition, au choix du client"
    ],
    correct: 1,
    explanation: "La garantie légale prévoit une hiérarchie stricte : mise en conformité (réparation ou remplacement) d'abord, puis remboursement uniquement si impossible, disproportionnée ou non effectuée dans un délai raisonnable."
  },
  {
    id: "PAR-Q4",
    question: "Un client apporte ses écouteurs sans fil car « un seul fonctionne ». Quelle est la première vérification à effectuer avant d'envisager un envoi en réparation ?",
    options: [
      "Envoyer directement en atelier SAV sans test",
      "Effectuer la procédure de reset (remise en boîtier + appui long)",
      "Proposer un remplacement immédiat",
      "Vérifier la compatibilité Bluetooth avec le téléphone du client"
    ],
    correct: 1,
    explanation: "La désynchronisation d'un écouteur est la cause la plus fréquente. La procédure de reset standard (remise dans le boîtier + maintien 10 s) resynchronise les deux écouteurs dans ~80 % des cas — filtering pur."
  },
  {
    id: "PAR-Q5",
    question: "Dans l'Escape Gamme JF2026, une équipe répond correctement « Filtering magasin » sur un produit, saisit le bon N° de série, mais se trompe sur le mot-clé SAVVY. Quel est son score total pour cet atelier ?",
    options: [
      "+4 points",
      "+3 points",
      "+2 points",
      "+1 point"
    ],
    correct: 2,
    explanation: "Filtering correct = +2 pts · N° de série correct = +1 pt · Mot-clé SAVVY incorrect = −1 pt → Total = +2 +1 −1 = +2 points. Lisez bien la contribution SAVVY avant de valider !"
  }
];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let db, currentTeam = null;
let _timerInterval = null, _timerSeconds = 0;
let _audioCtx = null;

function _getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function _playBeep(freq = 880, duration = 0.08, volume = 0.35) {
  try {
    const ctx = _getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function startTimer(seconds) {
  stopTimer();
  _timerSeconds = seconds;
  _updateTimerUI();
  _timerInterval = setInterval(() => {
    _timerSeconds--;
    _updateTimerUI();
    if (_timerSeconds <= 0) { stopTimer(); _onTimerExpired(); }
    else if (_timerSeconds <= 30) {
      _playBeep(880, 0.08);
      if (_timerSeconds <= 10) setTimeout(() => _playBeep(880, 0.08), 150);
    }
  }, 1000);
}
function stopTimer() {
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
}
function _updateTimerUI() {
  const el = document.getElementById('countdown-display');
  const bar = document.getElementById('timer-bar');
  if (!el || !bar) return;
  const m = Math.floor(Math.max(_timerSeconds, 0) / 60);
  const s = Math.max(_timerSeconds, 0) % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  bar.classList.toggle('warning', _timerSeconds <= 60 && _timerSeconds > 30);
  bar.classList.toggle('danger',  _timerSeconds <= 30 && _timerSeconds > 0);
  bar.classList.toggle('expired', _timerSeconds <= 0);
}
function _onTimerExpired() {
  const el = document.getElementById('countdown-display');
  const bar = document.getElementById('timer-bar');
  if (el) el.textContent = '00:00';
  if (bar) bar.classList.add('expired');
  showToast('⏰ Temps écoulé ! Finalisez votre réponse.', 4000);
}

let quizState = {
  currentQ: 0,         // index question en cours
  answers: [],          // {correct: bool, score: +1/-1} pour chaque question
  answered: false,      // question en cours déjà validée
  selectedOption: null  // option sélectionnée (avant validation)
};

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function setApp(html) { document.getElementById('app').innerHTML = html; }
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function header() {
  const team = currentTeam ? `<span class="header-team" style="cursor:default">${currentTeam.name}</span>` : '';
  return `<div class="header">
    <div class="header-left">
      <img src="Logo JF2026.jpg" alt="JF2026" class="header-logo" onerror="this.style.display='none'">
      <span class="header-title">🎯 Parcours Client</span>
    </div>
    <div class="header-right">
      ${team}
      <img src="academie.png" alt="Académie Fnac Darty" class="header-academie" onerror="this.style.display='none'">
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function init() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch(e) { db = null; }

  const saved = localStorage.getItem('jf2026_team');
  if (saved) try { currentTeam = JSON.parse(saved); } catch(e) {}

  if (!currentTeam) { showTeamSelect(); return; }
  checkAlreadyAnswered();
}

async function checkAlreadyAnswered() {
  if (db && currentTeam) {
    try {
      const snap = await db.ref(`/quiz_submissions/par/${currentTeam.id}`).get();
      if (snap.exists()) { showAlreadyDone(snap.val()); return; }
    } catch(e) {}
  }
  showIntro();
}

/* ═══════════════════════════════════════════
   TEAM SELECT
═══════════════════════════════════════════ */
async function showTeamSelect() {
  setApp(`${header()}
  <div class="content">
    <div class="loading"><div class="spinner"></div><p>Chargement des équipes...</p></div>
  </div>`);

  let registeredTeams = {};
  if (db) {
    try {
      const snap = await db.ref('/teams').get();
      if (snap.exists()) registeredTeams = snap.val();
    } catch(e) {}
  }

  const grid = TEAMS.map(t => {
    const reg = registeredTeams[t.id];
    const displayName = reg ? reg.name : t.name;
    const isTaken = !!reg;
    const memberCount = reg?.members?.length || 0;
    const statusText = isTaken
      ? `<div style="font-size:11px;color:#999;margin-top:4px">🔒 ${memberCount > 0 ? memberCount + ' membre' + (memberCount > 1 ? 's' : '') : 'Inscrite'}</div>`
      : `<div style="font-size:11px;color:var(--par2);margin-top:4px">Disponible</div>`;
    if (isTaken) {
      return `<button class="team-btn taken" disabled style="opacity:0.5;cursor:not-allowed">
        ${displayName}${statusText}
      </button>`;
    }
    return `<button class="team-btn" onclick="showTeamForm('${t.id}','${displayName.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
      ${displayName}${statusText}
    </button>`;
  }).join('');

  setApp(`${header()}
  <div class="content">
    <div class="screen-title">👋 Qui êtes-vous ?</div>
    <div class="screen-sub">Choisissez votre équipe pour commencer le Parcours Client</div>
    <div class="teams-grid">${grid}</div>
  </div>`);
}

async function showTeamForm(id, currentName) {
  if (db) {
    try {
      const snap = await db.ref(`/teams/${id}`).get();
      if (snap.exists() && snap.val()?.members?.length > 0) {
        showToast('⛔ Ce slot est déjà pris par une autre équipe.');
        setTimeout(() => showTeamSelect(), 900);
        return;
      }
    } catch(e) {}
  }
  const defaultName = currentName || TEAMS.find(t => t.id === id)?.name || id;
  setApp(`${header()}
  <div class="content">
    <div class="screen-title">✏️ Votre équipe</div>
    <div class="screen-sub">Slot : <strong>${id}</strong></div>
    <div class="form-group">
      <label class="form-label">Nom de l'équipe</label>
      <input class="text-input" id="team-name-input" type="text" placeholder="${defaultName}" value="${defaultName}" maxlength="30" />
    </div>
    <div class="form-group">
      <label class="form-label">Membres de l'équipe</label>
      <div class="members-list">
        <input class="text-input" id="m1" type="text" placeholder="Membre 1 (obligatoire)" maxlength="40" />
        <input class="text-input" id="m2" type="text" placeholder="Membre 2 (optionnel)" maxlength="40" />
        <input class="text-input" id="m3" type="text" placeholder="Membre 3 (optionnel)" maxlength="40" />
      </div>
    </div>
    <button class="btn-validate" onclick="confirmTeam('${id}')">✅ Rejoindre</button>
    <button class="btn-outline" onclick="showTeamSelect()">← Retour</button>
  </div>`);
}

async function confirmTeam(id) {
  const nameInput = document.getElementById('team-name-input');
  const defaultName = TEAMS.find(t => t.id === id)?.name || id;
  const name = nameInput?.value?.trim() || defaultName;
  const members = [];
  for (let i = 1; i <= 3; i++) {
    const val = document.getElementById(`m${i}`)?.value?.trim();
    if (val) members.push(val);
  }
  if (members.length === 0) { showToast('⚠️ Ajoutez au moins un membre'); return; }

  if (db) {
    try {
      const existing = await db.ref(`/teams/${id}`).get();
      if (existing.exists() && existing.val()?.members?.length > 0) {
        showToast('⛔ Ce slot vient d\'être pris par une autre équipe.');
        setTimeout(() => showTeamSelect(), 1200);
        return;
      }
      await db.ref(`/teams/${id}`).set({ id, name, members, updatedAt: Date.now(), locked: true });
    } catch(e) { showToast('Connexion instable, continuez quand même.'); }
  }

  currentTeam = {id, name, members};
  localStorage.setItem('jf2026_team', JSON.stringify(currentTeam));
  showToast(`✅ Équipe : ${name}`);
  showIntro();
}

/* ═══════════════════════════════════════════
   INTRO
═══════════════════════════════════════════ */
function showIntro() {
  stopTimer();
  quizState = { currentQ: 0, answers: [], answered: false, selectedOption: null };
  setApp(`${header()}
  <div class="content">
    <span class="workshop-badge">🎯 Atelier Parcours Client</span>
    <div style="text-align:center;padding:20px 0 28px">
      <div style="font-size:60px;margin-bottom:16px">🗺️</div>
      <div style="font-size:22px;font-weight:900;margin-bottom:10px;color:var(--par2)">Quiz Parcours Client</div>
      <div style="font-size:14px;color:#aaa;line-height:1.6;margin-bottom:28px">
        5 questions sur la garantie, le diagnostic et les droits du consommateur.<br><br>
        <strong style="color:var(--white)">Scoring :</strong><br>
        ✅ Bonne réponse : <strong style="color:#27AE60">+1 point</strong><br>
        ❌ Mauvaise réponse : <strong style="color:#C00000">−1 point</strong>
      </div>
      <button class="btn-validate" onclick="showQuestion(0)">🚀 Démarrer le quiz</button>
    </div>
    <div class="site-footer">
      Escape Gamme · Journée du Filtering 2026 · Fnac Darty
    </div>
  </div>`);
}

/* ═══════════════════════════════════════════
   QUESTION SCREEN
═══════════════════════════════════════════ */
function showQuestion(qIndex) {
  quizState.currentQ = qIndex;
  quizState.answered = false;
  quizState.selectedOption = null;
  const q = QUIZ[qIndex];
  const progress = ((qIndex) / QUIZ.length) * 100;
  const letters = ['A', 'B', 'C', 'D'];

  const optionsHtml = q.options.map((opt, i) => `
    <button class="option-btn" id="opt-${i}" onclick="selectOption(${i})" ${quizState.answered ? 'disabled' : ''}>
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt}</div>
    </button>`).join('');

  setApp(`${header()}
  <div class="content">
    <div class="timer-bar" id="timer-bar">
      <span style="font-size:20px">⏱️</span>
      <div>
        <div class="timer-display" id="countdown-display">05:00</div>
        <div class="timer-label">Temps restant</div>
      </div>
    </div>
    <span class="workshop-badge">🎯 Parcours Client</span>
    <div class="progress-header">
      <span class="progress-label">Question ${qIndex + 1} / ${QUIZ.length}</span>
      <span class="progress-counter">${QUIZ.length - qIndex - 1} restante${QUIZ.length - qIndex - 1 > 1 ? 's' : ''}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="question-card">
      <div class="question-num">Question ${qIndex + 1}</div>
      <div class="question-text">${q.question}</div>
    </div>
    <div class="options-list">${optionsHtml}</div>
    <button class="btn-validate" id="btn-validate" onclick="validateAnswer()" disabled>Valider ma réponse</button>
  </div>`);
  startTimer(5 * 60);
}

function selectOption(i) {
  if (quizState.answered) return;
  quizState.selectedOption = i;
  document.querySelectorAll('.option-btn').forEach((btn, idx) => {
    btn.classList.toggle('selected', idx === i);
  });
  document.getElementById('btn-validate').disabled = false;
}

function validateAnswer() {
  if (quizState.selectedOption === null || quizState.answered) return;
  stopTimer();
  quizState.answered = true;
  const q = QUIZ[quizState.currentQ];
  const selected = quizState.selectedOption;
  const isCorrect = selected === q.correct;
  const score = isCorrect ? 1 : -1;
  quizState.answers.push({ qId: q.id, selected, correct: q.correct, isCorrect, score });

  // Disable all buttons and apply visual feedback
  document.querySelectorAll('.option-btn').forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === q.correct) btn.classList.add('correct');
    else if (idx === selected && !isCorrect) btn.classList.add('wrong');
  });

  // Hide validate, show feedback + next button
  const btn = document.getElementById('btn-validate');
  if (btn) btn.style.display = 'none';

  const feedbackDiv = document.createElement('div');
  feedbackDiv.className = `feedback-card ${isCorrect ? 'correct' : 'wrong'}`;
  const isLast = quizState.currentQ === QUIZ.length - 1;
  feedbackDiv.innerHTML = `
    <div class="feedback-icon">${isCorrect ? '✅' : '❌'}</div>
    <div class="feedback-title ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? `Bonne réponse ! +1 point` : `Raté ! −1 point`}</div>
    <div class="feedback-expl">${q.explanation}</div>
    <button class="btn-next" onclick="${isLast ? 'showFinalResults()' : `showQuestion(${quizState.currentQ + 1})`}">
      ${isLast ? '🏁 Voir mes résultats' : '➡️ Question suivante'}
    </button>`;
  document.querySelector('.content').appendChild(feedbackDiv);
  feedbackDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ═══════════════════════════════════════════
   FINAL RESULTS
═══════════════════════════════════════════ */
async function showFinalResults() {
  stopTimer();
  const totalScore = quizState.answers.reduce((s, a) => s + a.score, 0);
  const correct = quizState.answers.filter(a => a.isCorrect).length;
  const letters = ['A', 'B', 'C', 'D'];

  // Emoji et message selon score
  let emoji = '😐', msg = 'Pas mal !';
  if (totalScore >= 4)  { emoji = '🏆'; msg = 'Excellent !'; }
  else if (totalScore >= 2) { emoji = '🎉'; msg = 'Bien joué !'; }
  else if (totalScore <= -2) { emoji = '💪'; msg = 'Il faut travailler !'; }
  else if (totalScore < 0)  { emoji = '😬'; msg = 'Peut mieux faire'; }

  const scoreClass = totalScore > 0 ? 'pos' : (totalScore < 0 ? 'neg' : 'zero');
  const fmt = v => (v > 0 ? '+' : '') + v;

  const summaryRows = quizState.answers.map((a, i) => {
    const q = QUIZ[i];
    return `<div class="answer-row">
      <div class="q-label">Q${i+1}</div>
      <div class="q-text">${q.options[a.correct]}</div>
      <div class="q-score ${a.score > 0 ? 'pos' : 'neg'}">${fmt(a.score)}</div>
    </div>`;
  }).join('');

  // Save to Firebase
  if (db && currentTeam) {
    try {
      await db.ref(`/quiz_submissions/par/${currentTeam.id}`).set({
        score: totalScore,
        correct,
        total: QUIZ.length,
        answers: quizState.answers,
        completedAt: Date.now()
      });
    } catch(e) { console.warn('Firebase save failed', e); }
  }

  setApp(`${header()}
  <div class="content">
    <span class="workshop-badge">🎯 Parcours Client — Résultats</span>
    <div class="result-card">
      <div class="result-icon">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-score-big ${scoreClass}">${fmt(totalScore)}</div>
      <div class="result-label">${correct} / ${QUIZ.length} bonnes réponses</div>
      <div class="answer-summary">${summaryRows}</div>
      <button class="btn-home" onclick="window.location.href='index.html'">🏠 Retour à l'accueil</button>
      <a class="btn-lb" href="leaderboard.html">🏆 Voir le classement</a>
    </div>
    <div class="site-footer">
      Escape Gamme · Journée du Filtering 2026 · Fnac Darty
    </div>
  </div>`);
}

/* ═══════════════════════════════════════════
   ALREADY DONE
═══════════════════════════════════════════ */

  const fmt = v => (v > 0 ? '+' : '') + v;
  const scoreClass = data.score > 0 ? 'pos' : (data.score < 0 ? 'neg' : 'zero');
  setApp(`${header()}
  <div class="content">
    <span class="workshop-badge">🎯 Parcours Client</span>
    <div class="done-card" style="margin-top:20px">
      <div style="font-size:40px;margin-bottom:12px">🔒</div>
      <div style="font-size:18px;font-weight:900;color:var(--par2);margin-bottom:6px">Quiz déjà complété !</div>
      <div style="font-size:13px;color:#aaa;margin-bottom:16px">Votre équipe a déjà soumis ses réponses pour l'atelier Parcours Client.</div>
      <div style="font-size:40px;font-weight:900;margin-bottom:4px" class="result-score-big ${scoreClass}">${fmt(data.score)}</div>
      <div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px">${data.correct} / ${data.total} bonnes réponses</div>
      <button class="btn-home" onclick="window.location.href='index.html'">🏠 Retour à l'accueil</button>
      <a class="btn-lb" href="leaderboard.html">🏆 Voir le classement</a>
    </div>
  </div>`);
}
